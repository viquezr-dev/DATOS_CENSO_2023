<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provincias de Panamá - Censo 2023</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; }
        #map { height: 100vh; width: 100%; }

        .control-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            padding: 12px 14px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-width: 290px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.3);
            max-height: 95vh;
            overflow-y: auto;
            font-size: 11px;
            min-width: 220px;
        }
        .control-panel h3 { 
            font-size: 13px; 
            color: #1a2a3a; 
            border-bottom: 2px solid #2c6b9e; 
            padding-bottom: 6px; 
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .control-panel label { 
            font-weight: 600; 
            font-size: 10px; 
            color: #2c3e50; 
            display: block; 
            margin-top: 5px; 
            margin-bottom: 2px; 
        }
        .control-panel select { 
            width: 100%; 
            padding: 4px 6px; 
            border-radius: 5px; 
            border: 1px solid #ccc; 
            background: white; 
            font-size: 10px; 
            cursor: pointer; 
            margin-bottom: 2px;
        }
        .control-panel select:focus { 
            outline: none; 
            border-color: #2c6b9e; 
            box-shadow: 0 0 0 2px rgba(44,107,158,0.2); 
        }

        .btn-group { 
            display: flex; 
            gap: 4px; 
            margin-top: 5px; 
            flex-wrap: wrap;
        }
        .btn-group button { 
            flex: 1; 
            min-width: 35px;
            padding: 4px 6px; 
            border-radius: 5px; 
            border: none; 
            font-size: 9px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: all 0.2s; 
        }
        .btn-map { background: #6c757d; color: white; }
        .btn-map:hover { background: #5a6268; }
        .btn-map.active { background: #2c6b9e; }
        .btn-export { background: #28a745; color: white; }
        .btn-export:hover { background: #1e7e34; }
        .btn-geojson { background: #fd7e14; color: white; }
        .btn-geojson:hover { background: #e06b0a; }
        .btn-reset { background: #dc3545; color: white; }
        .btn-reset:hover { background: #c82333; }

        .info-panel {
            margin-top: 8px;
            padding: 8px 10px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 3px solid #2c6b9e;
            font-size: 10px;
            line-height: 1.5;
            max-height: 320px;
            overflow-y: auto;
        }
        .info-panel h4 { 
            font-size: 11px; 
            color: #1a2a3a; 
            margin-bottom: 4px;
            border-bottom: 1px dashed #ddd;
            padding-bottom: 3px;
        }
        .info-panel .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 3px;
            margin-top: 4px;
        }
        .info-panel .stat-item {
            background: white;
            padding: 3px 5px;
            border-radius: 3px;
            text-align: center;
            border: 1px solid #eee;
        }
        .info-panel .stat-item .num { 
            font-weight: 700; 
            color: #2c6b9e; 
            font-size: 12px; 
            display: block;
        }
        .info-panel .stat-item .label { 
            color: #666; 
            font-size: 7px; 
            text-transform: uppercase;
        }
        .info-panel .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            border-bottom: 1px dashed #f0f0f0;
        }
        .info-panel .stat-row .key { color: #555; }
        .info-panel .stat-row .value { font-weight: 600; color: #1a2a3a; }

        .footer { 
            position: absolute; 
            bottom: 6px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 1000; 
            background: rgba(0,0,0,0.7); 
            color: white; 
            padding: 3px 12px; 
            border-radius: 14px; 
            font-size: 9px; 
            backdrop-filter: blur(2px); 
            pointer-events: none; 
            white-space: nowrap; 
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: rgba(255,255,255,0.95);
            padding: 25px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
            text-align: center;
            min-width: 250px;
        }
        .loading .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2c6b9e;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading .title { font-weight: 600; font-size: 14px; color: #1a2a3a; }
        .loading .subtitle { font-size: 11px; color: #666; margin-top: 4px; }
        .loading .success { color: #28a745; font-size: 11px; margin-top: 8px; }
        .loading .progress { 
            width: 100%; 
            height: 4px; 
            background: #e9ecef; 
            border-radius: 2px; 
            margin-top: 10px;
            overflow: hidden;
        }
        .loading .progress-bar {
            height: 100%;
            background: #2c6b9e;
            width: 0%;
            transition: width 0.3s;
        }

        .debug-panel {
            position: absolute;
            bottom: 40px;
            left: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            padding: 8px 12px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 9px;
            max-width: 350px;
            max-height: 120px;
            overflow-y: auto;
            display: none;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .control-panel { 
                top: 6px; 
                right: 6px; 
                max-width: 195px; 
                padding: 6px 8px; 
                font-size: 9px;
            }
            .control-panel h3 { font-size: 11px; }
            .info-panel .stat-grid { grid-template-columns: 1fr 1fr; }
            .info-panel .stat-item .num { font-size: 10px; }
            .loading { min-width: 180px; padding: 15px 20px; }
            .debug-panel { max-width: 180px; font-size: 8px; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="title" id="loading-title">Cargando datos...</div>
        <div class="subtitle" id="loading-subtitle">Provincias de Panamá</div>
        <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
        <div id="loading-status"></div>
    </div>

    <!-- Debug Panel -->
    <div class="debug-panel" id="debugPanel"></div>

    <div class="control-panel">
        <h3>🗺️ Panamá - Provincias</h3>

        <label>🗺️ Mapa base:</label>
        <div class="btn-group">
            <button class="btn-map active" onclick="cambiarMapa('satellite')" id="btn-satellite">🛰️</button>
            <button class="btn-map" onclick="cambiarMapa('osm')" id="btn-osm">🌍</button>
            <button class="btn-map" onclick="cambiarMapa('topo')" id="btn-topo">🗺️</button>
        </div>

        <div style="margin-top:6px;">
            <label>📍 Provincia:</label>
            <select id="provincia-select" onchange="seleccionarProvincia()">
                <option value="">Seleccionar provincia...</option>
            </select>
        </div>

        <div class="btn-group" style="margin-top:6px;">
            <button class="btn-geojson" onclick="exportarGeoJSON()">📥 GeoJSON</button>
            <button class="btn-export" onclick="exportarCSV()">📊 CSV</button>
            <button class="btn-reset" onclick="resetearMapa()">🔄 Reset</button>
        </div>

        <div class="info-panel" id="info-panel">
            <h4>📊 Datos del Censo 2023</h4>
            <div id="info-content">
                <p style="color:#888;font-style:italic;text-align:center;font-size:9px;padding:10px 0;">
                    Selecciona una provincia para ver los datos del censo
                </p>
            </div>
        </div>
    </div>

    <div class="footer">Datos: Censo 2023 – Raúl Viquez</div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // ================================================================
        // 1. DEBUG
        // ================================================================
        function debugLog(msg, type = 'info') {
            const panel = document.getElementById('debugPanel');
            panel.style.display = 'block';
            const colors = { info: '#0f0', warn: '#ff0', error: '#f44', success: '#0f0' };
            const prefix = { info: 'ℹ️', warn: '⚠️', error: '❌', success: '✅' };
            const time = new Date().toLocaleTimeString();
            panel.innerHTML += `<div style="color:${colors[type] || '#0f0'};border-bottom:1px solid #333;padding:1px 0;">
                ${prefix[type] || 'ℹ️'} ${time}: ${msg}
            </div>`;
            panel.scrollTop = panel.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${msg}`);
        }

        // ================================================================
        // 2. MAPA
        // ================================================================
        const map = L.map('map', { center: [8.5, -80.0], zoom: 7 });

        const layers = {
            satellite: L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: 'Tiles &copy; Esri',
                    maxZoom: 19
                }
            ),
            osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }),
            topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenTopoMap',
                maxZoom: 17
            })
        };

        layers.satellite.addTo(map);

        // ================================================================
        // 3. VARIABLES GLOBALES
        // ================================================================
        let geoData = { provincias: null };
        let currentLayerGeo = null;
        let highlightLayer = null;
        let currentSelected = null;
        let provinciaFeatures = [];

        const colores = [
            '#2c6b9e', '#28a745', '#dc3545', '#fd7e14', '#6f42c1',
            '#20c997', '#e83e8c', '#17a2b8', '#ffc107', '#6c757d',
            '#d63384', '#0dcaf0', '#198754'
        ];

        // ================================================================
        // 4. CARGA DE DATOS
        // ================================================================
        async function cargarProvincias() {
            try {
                debugLog('Cargando provincias desde provincias.geojson...', 'info');
                const response = await fetch('provincias.geojson');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                if (!data || !data.features) {
                    throw new Error('Formato inválido: no tiene "features"');
                }
                
                // Verificar geometría
                let geometriasValidas = 0;
                data.features.forEach(f => {
                    if (f.geometry && f.geometry.type) geometriasValidas++;
                });
                
                debugLog(`✅ Provincias cargadas: ${data.features.length} registros`, 'success');
                debugLog(`   📐 Geometrías válidas: ${geometriasValidas}`, 'info');
                
                geoData.provincias = data;
                provinciaFeatures = data.features;
                
                // Poblar select
                const select = document.getElementById('provincia-select');
                select.innerHTML = '<option value="">Seleccionar provincia...</option>';
                
                provinciaFeatures.sort((a, b) => {
                    const nomA = a.properties.PROV_NOMB || '';
                    const nomB = b.properties.PROV_NOMB || '';
                    return nomA.localeCompare(nomB);
                });
                
                provinciaFeatures.forEach((f, index) => {
                    const nombre = f.properties.PROV_NOMB || 'Provincia ' + (index + 1);
                    const id = f.properties.PROV_ID || index;
                    const option = document.createElement('option');
                    option.value = id;
                    option.textContent = nombre;
                    option.dataset.feature = JSON.stringify(f);
                    select.appendChild(option);
                });

                debugLog(`✅ Select poblado con ${provinciaFeatures.length} opciones`, 'success');

                // Mostrar en el mapa
                mostrarTodasLasProvincias();

                // Ocultar loading
                document.getElementById('loading').style.display = 'none';
                
            } catch (error) {
                debugLog(`Error cargando provincias: ${error.message}`, 'error');
                document.getElementById('loading').innerHTML = `
                    <div class="title" style="color:#dc3545;">❌ Error</div>
                    <div class="subtitle">${error.message}</div>
                    <div style="margin-top:10px;font-size:11px;color:#666;">
                        Verifica que <strong>provincias.geojson</strong><br>
                        esté en la misma carpeta
                    </div>
                    <button onclick="location.reload()" style="margin-top:10px;padding:6px 20px;border:none;background:#2c6b9e;color:white;border-radius:5px;cursor:pointer;font-size:12px;">
                        🔄 Reintentar
                    </button>
                `;
            }
        }

        // ================================================================
        // 5. MOSTRAR EN MAPA
        // ================================================================
        function mostrarTodasLasProvincias() {
            if (!geoData.provincias) {
                debugLog('No hay provincias para mostrar', 'warn');
                return;
            }
            
            if (currentLayerGeo) {
                map.removeLayer(currentLayerGeo);
                currentLayerGeo = null;
            }

            const features = geoData.provincias.features;
            debugLog(`Mostrando ${features.length} provincias en el mapa`, 'info');
            
            currentLayerGeo = L.geoJSON({
                type: 'FeatureCollection',
                features: features
            }, {
                style: function(feature, index) {
                    const idx = index % colores.length;
                    return {
                        fillColor: colores[idx],
                        fillOpacity: 0.35,
                        color: colores[idx],
                        weight: 2,
                        opacity: 0.8
                    };
                },
                onEachFeature: function(f, layer) {
                    const props = f.properties;
                    const nombre = props.PROV_NOMB || 'Provincia';
                    layer.bindTooltip(nombre, { permanent: false, direction: 'center' });
                    layer.on('click', function() {
                        const select = document.getElementById('provincia-select');
                        for (let i = 0; i < select.options.length; i++) {
                            if (select.options[i].textContent === nombre) {
                                select.selectedIndex = i;
                                seleccionarProvincia();
                                break;
                            }
                        }
                    });
                }
            }).addTo(map);

            debugLog(`✅ ${features.length} provincias mostradas`, 'success');

            const bounds = L.geoJSON({ type: 'FeatureCollection', features }).getBounds();
            if (bounds.isValid()) {
                map.fitBounds(bounds, { padding: [20, 20] });
            }
        }

        function mostrarProvincia(feature) {
            if (!feature) {
                debugLog('No hay feature para mostrar', 'warn');
                return;
            }
            
            if (currentLayerGeo) {
                map.removeLayer(currentLayerGeo);
                currentLayerGeo = null;
            }
            if (highlightLayer) {
                map.removeLayer(highlightLayer);
                highlightLayer = null;
            }

            debugLog(`Mostrando provincia: ${feature.properties.PROV_NOMB || 'Provincia'}`, 'info');

            currentLayerGeo = L.geoJSON(feature, {
                style: {
                    fillColor: '#2c6b9e',
                    fillOpacity: 0.35,
                    color: '#1a4a7a',
                    weight: 3,
                    opacity: 0.9
                },
                onEachFeature: function(f, layer) {
                    const props = f.properties;
                    const nombre = props.PROV_NOMB || 'Provincia';
                    layer.bindTooltip(nombre, { permanent: false, direction: 'center' });
                }
            }).addTo(map);

            highlightLayer = L.geoJSON(feature, {
                style: {
                    fillColor: 'transparent',
                    color: '#ff6b35',
                    weight: 4,
                    opacity: 0.8,
                    dashArray: '6, 4'
                }
            }).addTo(map);

            zoomAFeature(feature);
        }

        function zoomAFeature(feature) {
            try {
                const bounds = L.geoJSON(feature).getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 10 });
                }
            } catch (e) {
                debugLog(`Error al hacer zoom: ${e.message}`, 'warn');
            }
        }

        // ================================================================
        // 6. SELECCIÓN DE PROVINCIA
        // ================================================================
        function seleccionarProvincia() {
            const select = document.getElementById('provincia-select');
            const provId = select.value;
            
            if (!provId) {
                mostrarTodasLasProvincias();
                limpiarInfo();
                return;
            }

            const provFeature = select.options[select.selectedIndex]?.dataset?.feature;
            if (provFeature) {
                currentSelected = JSON.parse(provFeature);
                mostrarInfo(currentSelected.properties);
                mostrarProvincia(currentSelected);
            }
        }

        // ================================================================
        // 7. PANEL DE INFORMACIÓN
        // ================================================================
        function mostrarInfo(props) {
            const container = document.getElementById('info-content');

            const nombre = props.PROV_NOMB || 'Sin nombre';
            const id = props.PROV_ID || 'N/A';
            
            // Convertir a números
            const poblacion = parseFloat(props.N_PERSONAS) || 0;
            const viviendas = parseFloat(props.N_VIVIENDA) || 0;
            const area = parseFloat(props.AREA) || 0;
            const hombres = parseFloat(props.P_HOMBRES) || 0;
            const mujeres = parseFloat(props.P_MUJERES) || 0;
            const analf = parseFloat(props.ANALFAB) || 0;
            const desocup = parseFloat(props.DESOCUP) || 0;
            const sinAgua = parseFloat(props.SIN_AGUA) || 0;
            const sinLuz = parseFloat(props.SIN_LUZ) || 0;
            const sinInternet = parseFloat(props.SIN_INTERN) || 0;
            const conDisc = parseFloat(props.CON_DISC) || 0;
            const mayor18 = parseFloat(props.MAYOR_18) || 0;
            const sinServSan = parseFloat(props.SIN_SER_SA) || 0;
            const sinTV = parseFloat(props.SIN_TV) || 0;
            const sinRadio = parseFloat(props.SIN_RADIO) || 0;
            const sinTelefono = parseFloat(props.SIN_TEL_RE) || 0;
            const sinCelular = parseFloat(props.SIN_TEL_CE) || 0;

            debugLog(`Mostrando info de ${nombre} (Población: ${poblacion.toLocaleString()})`, 'info');

            let html = `<h4>📍 ${nombre}</h4>`;

            // Grid de estadísticas principales
            html += `<div class="stat-grid">
                <div class="stat-item">
                    <span class="num">${poblacion > 0 ? poblacion.toLocaleString() : 'N/D'}</span>
                    <span class="label">Población</span>
                </div>
                <div class="stat-item">
                    <span class="num">${viviendas > 0 ? viviendas.toLocaleString() : 'N/D'}</span>
                    <span class="label">Viviendas</span>
                </div>
                <div class="stat-item">
                    <span class="num">${viviendas > 0 && poblacion > 0 ? (poblacion / viviendas).toFixed(2) : 'N/D'}</span>
                    <span class="label">Pers./Viv.</span>
                </div>
            </div>`;

            // Detalles
            html += `<div style="margin-top:4px;">`;
            const detalles = [
                ['👨 Hombres', hombres > 0 ? hombres.toLocaleString() : null],
                ['👩 Mujeres', mujeres > 0 ? mujeres.toLocaleString() : null],
                ['👤 Mayores de 18', mayor18 > 0 ? mayor18.toLocaleString() : null],
                ['📐 Área (km²)', area > 0 ? (area / 1000000).toFixed(2) : null],
                ['📊 Analfabetismo', analf > 0 ? analf.toFixed(1) + '%' : null],
                ['📊 Desocupación', desocup > 0 ? desocup.toFixed(1) + '%' : null],
                ['🚰 Sin agua', sinAgua > 0 ? sinAgua.toFixed(1) + '%' : null],
                ['💡 Sin luz', sinLuz > 0 ? sinLuz.toFixed(1) + '%' : null],
                ['📡 Sin internet', sinInternet > 0 ? sinInternet.toFixed(1) + '%' : null],
                ['🚽 Sin servicio sanitario', sinServSan > 0 ? sinServSan.toFixed(1) + '%' : null],
                ['📺 Sin TV', sinTV > 0 ? sinTV.toFixed(1) + '%' : null],
                ['📻 Sin radio', sinRadio > 0 ? sinRadio.toFixed(1) + '%' : null],
                ['📞 Sin teléfono fijo', sinTelefono > 0 ? sinTelefono.toFixed(1) + '%' : null],
                ['📱 Sin celular', sinCelular > 0 ? sinCelular.toFixed(1) + '%' : null],
                ['♿ Con discapacidad', conDisc > 0 ? conDisc.toLocaleString() : null]
            ];
            detalles.forEach(([key, value]) => {
                if (value !== null) {
                    html += `<div class="stat-row">
                        <span class="key">${key}</span>
                        <span class="value">${value}</span>
                    </div>`;
                }
            });
            html += `</div>`;

            if (id !== 'N/A') {
                html += `<div style="margin-top:3px;font-size:8px;color:#888;border-top:1px dashed #ddd;padding-top:3px;">
                    ID: ${id}
                </div>`;
            }

            container.innerHTML = html;
        }

        function limpiarInfo() {
            document.getElementById('info-content').innerHTML = `
                <p style="color:#888;font-style:italic;text-align:center;font-size:9px;padding:10px 0;">
                    Selecciona una provincia para ver los datos del censo
                </p>
            `;
        }

        // ================================================================
        // 8. EXPORTAR
        // ================================================================
        function exportarGeoJSON() {
            if (!currentLayerGeo) {
                alert('No hay ningún polígono seleccionado para exportar.');
                return;
            }

            const data = currentLayerGeo.toGeoJSON();
            const nombre = currentSelected?.properties?.PROV_NOMB || 'panama';

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${nombre.toLowerCase().replace(/\s+/g, '_')}.geojson`;
            link.click();
            URL.revokeObjectURL(link.href);
            debugLog(`📥 GeoJSON exportado: ${nombre}`, 'success');
        }

        function exportarCSV() {
            const props = currentSelected?.properties;

            if (!props) {
                alert('No hay datos para exportar.');
                return;
            }

            const headers = Object.keys(props);
            const values = headers.map(h => props[h] !== undefined ? props[h] : '');
            
            let csv = headers.join(',') + '\n';
            csv += values.join(',') + '\n';

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `provincia_${props.PROV_NOMB || 'datos'}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
            debugLog('📊 CSV exportado', 'success');
        }

        // ================================================================
        // 9. MAPA BASE
        // ================================================================
        function cambiarMapa(tipo) {
            Object.keys(layers).forEach(key => {
                if (map.hasLayer(layers[key])) map.removeLayer(layers[key]);
            });
            if (layers[tipo]) layers[tipo].addTo(map);
            document.querySelectorAll('.btn-map').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${tipo}`).classList.add('active');
        }

        // ================================================================
        // 10. RESET
        // ================================================================
        function resetearMapa() {
            document.getElementById('provincia-select').selectedIndex = 0;
            currentSelected = null;
            limpiarInfo();
            
            if (currentLayerGeo) {
                map.removeLayer(currentLayerGeo);
                currentLayerGeo = null;
            }
            if (highlightLayer) {
                map.removeLayer(highlightLayer);
                highlightLayer = null;
            }

            if (geoData.provincias) {
                const bounds = L.geoJSON(geoData.provincias).getBounds();
                if (bounds.isValid()) map.fitBounds(bounds, { padding: [20, 20] });
                mostrarTodasLasProvincias();
            } else {
                map.setView([8.5, -80.0], 7);
            }
            debugLog('🔄 Mapa reseteado', 'info');
        }

        // ================================================================
        // 11. INICIO
        // ================================================================
        window.cambiarMapa = cambiarMapa;
        window.seleccionarProvincia = seleccionarProvincia;
        window.exportarGeoJSON = exportarGeoJSON;
        window.exportarCSV = exportarCSV;
        window.resetearMapa = resetearMapa;

        console.log('🗺️ Provincias de Panamá - Censo 2023');
        console.log('📌 Cargando datos...');

        cargarProvincias();
    </script>

</body>
</html>
