<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provincias de Panamá - Datos del Censo</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; }
        #map { height: 100vh; width: 100%; }

        .control-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            padding: 12px 14px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-width: 330px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.3);
            max-height: 95vh;
            overflow-y: auto;
            font-size: 11px;
            min-width: 220px;
        }
        .control-panel h3 { 
            font-size: 13px; 
            color: #1a2a3a; 
            border-bottom: 2px solid #2c6b9e; 
            padding-bottom: 6px; 
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .control-panel label { 
            font-weight: 600; 
            font-size: 10px; 
            color: #2c3e50; 
            display: block; 
            margin-top: 5px; 
            margin-bottom: 2px; 
        }
        .control-panel select { 
            width: 100%; 
            padding: 4px 6px; 
            border-radius: 5px; 
            border: 1px solid #ccc; 
            background: white; 
            font-size: 10px; 
            cursor: pointer; 
            margin-bottom: 2px;
        }
        .control-panel select:focus { 
            outline: none; 
            border-color: #2c6b9e; 
            box-shadow: 0 0 0 2px rgba(44,107,158,0.2); 
        }

        .btn-group { 
            display: flex; 
            gap: 4px; 
            margin-top: 5px; 
            flex-wrap: wrap;
        }
        .btn-group button { 
            flex: 1; 
            min-width: 35px;
            padding: 4px 6px; 
            border-radius: 5px; 
            border: none; 
            font-size: 9px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: all 0.2s; 
        }
        .btn-map { background: #6c757d; color: white; }
        .btn-map:hover { background: #5a6268; }
        .btn-map.active { background: #2c6b9e; }
        .btn-export { background: #28a745; color: white; }
        .btn-export:hover { background: #1e7e34; }
        .btn-geojson { background: #fd7e14; color: white; }
        .btn-geojson:hover { background: #e06b0a; }
        .btn-reset { background: #dc3545; color: white; }
        .btn-reset:hover { background: #c82333; }

        .info-panel {
            margin-top: 8px;
            padding: 8px 10px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 3px solid #2c6b9e;
            font-size: 10px;
            line-height: 1.5;
            max-height: 420px;
            overflow-y: auto;
        }
        .info-panel h4 { 
            font-size: 11px; 
            color: #1a2a3a; 
            margin-bottom: 4px;
            border-bottom: 1px dashed #ddd;
            padding-bottom: 3px;
        }
        .info-panel table {
            width: 100%;
            border-collapse: collapse;
            font-size: 9px;
        }
        .info-panel table tr:nth-child(even) {
            background: #f8f9fa;
        }
        .info-panel table tr:hover {
            background: #e9ecef;
        }
        .info-panel table td {
            padding: 3px 5px;
            border-bottom: 1px solid #eee;
        }
        .info-panel table .campo {
            color: #555;
            font-weight: 500;
            width: 55%;
        }
        .info-panel table .valor {
            font-weight: 600;
            color: #1a2a3a;
            text-align: right;
            width: 45%;
        }
        .info-panel .sin-datos {
            color: #888;
            font-style: italic;
            text-align: center;
            padding: 15px 0;
            font-size: 9px;
        }

        .footer { 
            position: absolute; 
            bottom: 6px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 1000; 
            background: rgba(0,0,0,0.7); 
            color: white; 
            padding: 3px 12px; 
            border-radius: 14px; 
            font-size: 9px; 
            backdrop-filter: blur(2px); 
            pointer-events: none; 
            white-space: nowrap; 
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: rgba(255,255,255,0.95);
            padding: 25px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
            text-align: center;
            min-width: 250px;
        }
        .loading .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2c6b9e;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading .title { font-weight: 600; font-size: 14px; color: #1a2a3a; }
        .loading .subtitle { font-size: 11px; color: #666; margin-top: 4px; }

        .debug-panel {
            position: absolute;
            bottom: 40px;
            left: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            padding: 8px 12px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 9px;
            max-width: 350px;
            max-height: 120px;
            overflow-y: auto;
            display: none;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .control-panel { 
                top: 6px; 
                right: 6px; 
                max-width: 195px; 
                padding: 6px 8px; 
                font-size: 9px;
            }
            .control-panel h3 { font-size: 11px; }
            .loading { min-width: 180px; padding: 15px 20px; }
            .debug-panel { max-width: 180px; font-size: 8px; }
            .info-panel table { font-size: 8px; }
            .info-panel table .campo { width: 50%; }
            .info-panel table .valor { width: 50%; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="title" id="loading-title">Cargando datos...</div>
        <div class="subtitle" id="loading-subtitle">Provincias de Panamá</div>
        <div id="loading-status"></div>
    </div>

    <!-- Debug Panel -->
    <div class="debug-panel" id="debugPanel"></div>

    <div class="control-panel">
        <h3>🗺️ Panamá - Provincias</h3>

        <label>🗺️ Mapa base:</label>
        <div class="btn-group">
            <button class="btn-map active" onclick="cambiarMapa('satellite')" id="btn-satellite">🛰️</button>
            <button class="btn-map" onclick="cambiarMapa('osm')" id="btn-osm">🌍</button>
            <button class="btn-map" onclick="cambiarMapa('topo')" id="btn-topo">🗺️</button>
        </div>

        <div style="margin-top:6px;">
            <label>📍 Provincia:</label>
            <select id="provincia-select" onchange="seleccionarProvincia()">
                <option value="">Seleccionar provincia...</option>
            </select>
        </div>

        <div class="btn-group" style="margin-top:6px;">
            <button class="btn-geojson" onclick="exportarGeoJSON()">📥 GeoJSON</button>
            <button class="btn-export" onclick="exportarCSV()">📊 CSV</button>
            <button class="btn-reset" onclick="resetearMapa()">🔄 Reset</button>
        </div>

        <div class="info-panel" id="info-panel">
            <h4>📋 Datos del Censo</h4>
            <div id="info-content">
                <div class="sin-datos">
                    🗺️ Haz clic en una provincia en el mapa<br>
                    o selecciónala en el menú para ver los datos
                </div>
            </div>
        </div>
    </div>

    <div class="footer">Datos: Censo 2023 – Raúl Viquez</div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // ================================================================
        // 1. DEBUG
        // ================================================================
        function debugLog(msg, type = 'info') {
            const panel = document.getElementById('debugPanel');
            panel.style.display = 'block';
            const colors = { info: '#0f0', warn: '#ff0', error: '#f44', success: '#0f0' };
            const prefix = { info: 'ℹ️', warn: '⚠️', error: '❌', success: '✅' };
            const time = new Date().toLocaleTimeString();
            panel.innerHTML += `<div style="color:${colors[type] || '#0f0'};border-bottom:1px solid #333;padding:1px 0;">
                ${prefix[type] || 'ℹ️'} ${time}: ${msg}
            </div>`;
            panel.scrollTop = panel.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${msg}`);
        }

        // ================================================================
        // 2. MAPA
        // ================================================================
        const map = L.map('map', { center: [8.5, -80.0], zoom: 7 });

        const layers = {
            satellite: L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: 'Tiles &copy; Esri',
                    maxZoom: 19
                }
            ),
            osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }),
            topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenTopoMap',
                maxZoom: 17
            })
        };

        layers.satellite.addTo(map);

        // ================================================================
        // 3. VARIABLES GLOBALES
        // ================================================================
        let geoData = { provincias: null };
        let currentLayerGeo = null;
        let highlightLayer = null;
        let currentSelected = null;
        let provinciaFeatures = [];

        const colores = [
            '#2c6b9e', '#28a745', '#dc3545', '#fd7e14', '#6f42c1',
            '#20c997', '#e83e8c', '#17a2b8', '#ffc107', '#6c757d',
            '#d63384', '#0dcaf0', '#198754'
        ];

        // ================================================================
        // 4. DICCIONARIO DE CAMPOS
        // ================================================================
        const descripcionCampos = {
            'PROV_ID': 'Código de Provincia',
            'PROV_NOMB': 'Nombre de Provincia',
            'PROV_LEY': 'Ley de Creación',
            'LEY_MOD_P': 'Ley Modificatoria',
            'GACETA_P': 'Gaceta Oficial',
            'GACE_MOD_P': 'Gaceta Modificatoria',
            'PERIMETRO': 'Perímetro (m)',
            'AREA': 'Área (m²)',
            'N_PERSONAS': 'Total de Personas',
            'P_HOMBRES': 'Cantidad de Hombres',
            'P_MUJERES': 'Cantidad de Mujeres',
            'MAYOR_18': 'Mayores de 18 años',
            'MENOS_PRIM': 'Menos de 3er grado de primaria',
            'AGROPEC': 'Actividades Agropecuarias',
            'NO_ECO_ACT': 'No Económicamente Activa',
            'DESOCUP': 'Desocupados',
            'ANALFAB': 'Analfabeta',
            'CON_DISC': 'Con alguna Discapacidad',
            'N_VIVIENDA': 'Total de Viviendas',
            'V_INDIV': 'Vivienda Individual',
            'V_IMPROV': 'Vivienda Improvisada',
            'V_APARTAM': 'Apartamento',
            'V_CUARTOS': 'Cuarto en Casa de Vecindad',
            'V_LOCAL': 'Local usado como Vivienda',
            'V_DAMNI': 'Damnificados',
            'V_INDIG': 'Indigentes',
            'V_COLECTIV': 'Vivienda Colectiva',
            'V_ASILOS': 'Asilos / Hogar de Ancianos',
            'V_PRO_ADOL': 'Protección de Niños y Adolescentes',
            'V_CARCELES': 'Cárceles / Centros de Custodia',
            'V_CON_REL': 'Conventos / Seminarios',
            'V_TRABA': 'Trabajaderos',
            'V_ALBE_MIG': 'Albergues de Migrantes',
            'V_REHABILI': 'Centros de Rehabilitación',
            'V_OTR_COLE': 'Otra Vivienda Colectiva',
            'TOTA_VIV_P': 'Viviendas con Ocupantes Presentes',
            'CON_PISO_T': 'Con Piso de Tierra',
            'SIN_AGUA': 'Sin Agua Potable',
            'SIN_SER_SA': 'Sin Servicio Sanitario',
            'SIN_LUZ': 'Sin Luz Eléctrica',
            'COC_LEÑA': 'Cocinan con Leña',
            'COC_CARBON': 'Cocinan con Carbón',
            'SIN_TV': 'Sin Televisor',
            'SIN_RADIO': 'Sin Radio',
            'SIN_TEL_RE': 'Sin Teléfono Residencial',
            'SIN_TEL_CE': 'Sin Teléfono Celular Activo',
            'SIN_INTERN': 'Sin Acceso a Internet',
            'ID1': 'ID Interno'
        };

        // ================================================================
        // 5. CARGA DE DATOS
        // ================================================================
        async function cargarProvincias() {
            try {
                debugLog('Cargando provincias desde provincias.geojson...', 'info');
                const response = await fetch('provincias.geojson');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                if (!data || !data.features) {
                    throw new Error('Formato inválido: no tiene "features"');
                }
                
                geoData.provincias = data;
                provinciaFeatures = data.features;
                
                // Poblar select
                const select = document.getElementById('provincia-select');
                select.innerHTML = '<option value="">Seleccionar provincia...</option>';
                
                provinciaFeatures.sort((a, b) => {
                    const nomA = a.properties.PROV_NOMB || '';
                    const nomB = b.properties.PROV_NOMB || '';
                    return nomA.localeCompare(nomB);
                });
                
                provinciaFeatures.forEach((f, index) => {
                    const nombre = f.properties.PROV_NOMB || 'Provincia ' + (index + 1);
                    const id = f.properties.PROV_ID || index;
                    const option = document.createElement('option');
                    option.value = id;
                    option.textContent = nombre;
                    option.dataset.feature = JSON.stringify(f);
                    select.appendChild(option);
                });

                debugLog(`✅ ${provinciaFeatures.length} provincias cargadas`, 'success');

                // Mostrar en el mapa
                mostrarTodasLasProvincias();

                // Mostrar mensaje en el panel
                document.getElementById('info-content').innerHTML = `
                    <div class="sin-datos">
                        🗺️ Haz clic en una provincia en el mapa<br>
                        o selecciónala en el menú para ver los datos
                    </div>
                `;

                // Ocultar loading
                document.getElementById('loading').style.display = 'none';
                
            } catch (error) {
                debugLog(`Error: ${error.message}`, 'error');
                document.getElementById('loading').innerHTML = `
                    <div class="title" style="color:#dc3545;">❌ Error</div>
                    <div class="subtitle">${error.message}</div>
                    <div style="margin-top:10px;font-size:11px;color:#666;">
                        Verifica que <strong>provincias.geojson</strong><br>
                        esté en la misma carpeta
                    </div>
                    <button onclick="location.reload()" style="margin-top:10px;padding:6px 20px;border:none;background:#2c6b9e;color:white;border-radius:5px;cursor:pointer;font-size:12px;">
                        🔄 Reintentar
                    </button>
                `;
            }
        }

        // ================================================================
        // 6. MOSTRAR EN MAPA
        // ================================================================
        function mostrarTodasLasProvincias() {
            if (!geoData.provincias) return;
            
            if (currentLayerGeo) {
                map.removeLayer(currentLayerGeo);
                currentLayerGeo = null;
            }

            const features = geoData.provincias.features;
            
            try {
                currentLayerGeo = L.geoJSON({
                    type: 'FeatureCollection',
                    features: features
                }, {
                    style: function(feature, index) {
                        const idx = index % colores.length;
                        return {
                            fillColor: colores[idx],
                            fillOpacity: 0.35,
                            color: colores[idx],
                            weight: 2,
                            opacity: 0.8
                        };
                    },
                    onEachFeature: function(f, layer) {
                        const props = f.properties;
                        const nombre = props.PROV_NOMB || 'Provincia';
                        
                        // Tooltip al pasar el mouse
                        layer.bindTooltip(nombre, { 
                            permanent: false, 
                            direction: 'center',
                            className: 'provincia-tooltip'
                        });
                        
                        // Al hacer clic, seleccionar la provincia
                        layer.on('click', function() {
                            const select = document.getElementById('provincia-select');
                            for (let i = 0; i < select.options.length; i++) {
                                if (select.options[i].textContent === nombre) {
                                    select.selectedIndex = i;
                                    seleccionarProvincia();
                                    break;
                                }
                            }
                        });
                    }
                }).addTo(map);

                // Ajustar zoom a todas las provincias
                const bounds = L.geoJSON({ type: 'FeatureCollection', features }).getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds, { padding: [20, 20] });
                    debugLog('📍 Zoom ajustado a todas las provincias', 'info');
                }
                
                debugLog(`✅ ${features.length} provincias mostradas en el mapa`, 'success');
            } catch (error) {
                debugLog(`Error al mostrar: ${error.message}`, 'error');
            }
        }

        function mostrarProvincia(feature) {
            if (!feature) return;
            
            if (currentLayerGeo) {
                map.removeLayer(currentLayerGeo);
                currentLayerGeo = null;
            }
            if (highlightLayer) {
                map.removeLayer(highlightLayer);
                highlightLayer = null;
            }

            try {
                // Mostrar la provincia seleccionada con color destacado
                currentLayerGeo = L.geoJSON(feature, {
                    style: {
                        fillColor: '#2c6b9e',
                        fillOpacity: 0.35,
                        color: '#1a4a7a',
                        weight: 3,
                        opacity: 0.9
                    },
                    onEachFeature: function(f, layer) {
                        const props = f.properties;
                        const nombre = props.PROV_NOMB || 'Provincia';
                        layer.bindTooltip(nombre, { permanent: false, direction: 'center' });
                    }
                }).addTo(map);

                // Borde resaltado
                highlightLayer = L.geoJSON(feature, {
                    style: {
                        fillColor: 'transparent',
                        color: '#ff6b35',
                        weight: 4,
                        opacity: 0.8,
                        dashArray: '6, 4'
                    }
                }).addTo(map);

                // Hacer zoom a la provincia
                const bounds = L.geoJSON(feature).getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 10 });
                }
            } catch (error) {
                debugLog(`Error al mostrar provincia: ${error.message}`, 'error');
            }
        }

        // ================================================================
        // 7. SELECCIÓN DE PROVINCIA
        // ================================================================
        function seleccionarProvincia() {
            const select = document.getElementById('provincia-select');
            const provId = select.value;
            
            if (!provId) {
                mostrarTodasLasProvincias();
                document.getElementById('info-content').innerHTML = `
                    <div class="sin-datos">
                        🗺️ Haz clic en una provincia en el mapa<br>
                        o selecciónala en el menú para ver los datos
                    </div>
                `;
                return;
            }

            const provFeature = select.options[select.selectedIndex]?.dataset?.feature;
            if (provFeature) {
                currentSelected = JSON.parse(provFeature);
                mostrarDatosTabla(currentSelected.properties);
                mostrarProvincia(currentSelected);
            }
        }

        // ================================================================
        // 8. MOSTRAR DATOS EN TABLA CON NOMBRES DESCRIPTIVOS
        // ================================================================
        function mostrarDatosTabla(props) {
            const container = document.getElementById('info-content');
            
            const nombre = props.PROV_NOMB || 'Sin nombre';
            
            // Orden de campos (priorizando los más importantes primero)
            const camposPrioritarios = [
                'PROV_ID', 'PROV_NOMB', 'PROV_LEY', 'LEY_MOD_P', 'GACETA_P', 'GACE_MOD_P',
                'AREA', 'PERIMETRO',
                'N_PERSONAS', 'P_HOMBRES', 'P_MUJERES', 'MAYOR_18',
                'N_VIVIENDA', 'V_INDIV', 'V_APARTAM', 'V_IMPROV', 'V_CUARTOS', 'V_LOCAL',
                'TOTA_VIV_P', 'CON_PISO_T',
                'SIN_AGUA', 'SIN_SER_SA', 'SIN_LUZ', 'SIN_INTERN',
                'SIN_TV', 'SIN_RADIO', 'SIN_TEL_RE', 'SIN_TEL_CE',
                'COC_LEÑA', 'COC_CARBON',
                'MENOS_PRIM', 'AGROPEC', 'NO_ECO_ACT', 'DESOCUP', 'ANALFAB', 'CON_DISC',
                'V_COLECTIV', 'V_ASILOS', 'V_PRO_ADOL', 'V_CARCELES',
                'V_CON_REL', 'V_TRABA', 'V_ALBE_MIG', 'V_REHABILI', 'V_OTR_COLE',
                'V_DAMNI', 'V_INDIG',
                'ID1'
            ];

            let html = `<h4>📋 ${nombre}</h4>`;
            html += `<table>`;

            let tieneDatos = false;

            camposPrioritarios.forEach(campo => {
                let valor = props[campo];
                if (valor !== undefined && valor !== null && valor !== '') {
                    tieneDatos = true;
                    // Obtener nombre descriptivo
                    const nombreCampo = descripcionCampos[campo] || campo;
                    
                    // Formatear números
                    if (typeof valor === 'number' || !isNaN(parseFloat(valor))) {
                        const num = parseFloat(valor);
                        if (Number.isInteger(num)) {
                            valor = num.toLocaleString();
                        } else {
                            valor = num.toFixed(2);
                        }
                    }
                    html += `<tr>
                        <td class="campo">${nombreCampo}</td>
                        <td class="valor">${valor}</td>
                    </tr>`;
                }
            });

            html += `</table>`;

            if (!tieneDatos) {
                html = `<div class="sin-datos">No hay datos disponibles para esta provincia</div>`;
            }

            container.innerHTML = html;
        }

        // ================================================================
        // 9. EXPORTAR
        // ================================================================
        function exportarGeoJSON() {
            if (!currentLayerGeo) {
                alert('No hay ningún polígono seleccionado para exportar.');
                return;
            }

            const data = currentLayerGeo.toGeoJSON();
            const nombre = currentSelected?.properties?.PROV_NOMB || 'panama';

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${nombre.toLowerCase().replace(/\s+/g, '_')}.geojson`;
            link.click();
            URL.revokeObjectURL(link.href);
            debugLog(`📥 GeoJSON exportado: ${nombre}`, 'success');
        }

        function exportarCSV() {
            const props = currentSelected?.properties;

            if (!props) {
                alert('No hay datos para exportar.');
                return;
            }

            // Usar nombres descriptivos como headers
            const headers = Object.keys(props);
            const headersDescriptivos = headers.map(h => descripcionCampos[h] || h);
            const values = headers.map(h => props[h] !== undefined ? props[h] : '');
            
            let csv = headersDescriptivos.join(',') + '\n';
            csv += values.join(',') + '\n';

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `provincia_${props.PROV_NOMB || 'datos'}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
            debugLog('📊 CSV exportado', 'success');
        }

        // ================================================================
        // 10. MAPA BASE
        // ================================================================
        function cambiarMapa(tipo) {
            Object.keys(layers).forEach(key => {
                if (map.hasLayer(layers[key])) map.removeLayer(layers[key]);
            });
            if (layers[tipo]) layers[tipo].addTo(map);
            document.querySelectorAll('.btn-map').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${tipo}`).classList.add('active');
        }

        // ================================================================
        // 11. RESET
        // ================================================================
        function resetearMapa() {
            document.getElementById('provincia-select').selectedIndex = 0;
            currentSelected = null;
            
            if (currentLayerGeo) {
                map.removeLayer(currentLayerGeo);
                currentLayerGeo = null;
            }
            if (highlightLayer) {
                map.removeLayer(highlightLayer);
                highlightLayer = null;
            }

            if (geoData.provincias) {
                const bounds = L.geoJSON(geoData.provincias).getBounds();
                if (bounds.isValid()) map.fitBounds(bounds, { padding: [20, 20] });
                mostrarTodasLasProvincias();
            } else {
                map.setView([8.5, -80.0], 7);
            }

            document.getElementById('info-content').innerHTML = `
                <div class="sin-datos">
                    🗺️ Haz clic en una provincia en el mapa<br>
                    o selecciónala en el menú para ver los datos
                </div>
            `;
            debugLog('🔄 Mapa reseteado', 'info');
        }

        // ================================================================
        // 12. INICIO
        // ================================================================
        window.cambiarMapa = cambiarMapa;
        window.seleccionarProvincia = seleccionarProvincia;
        window.exportarGeoJSON = exportarGeoJSON;
        window.exportarCSV = exportarCSV;
        window.resetearMapa = resetearMapa;

        console.log('🗺️ Provincias de Panamá - Datos del Censo');
        console.log('📌 Cargando datos...');

        cargarProvincias();
    </script>

</body>
</html>
