<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explorador Administrativo - Panamá</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; }
        #map { height: 100vh; width: 100%; }

        .control-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            padding: 12px 14px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-width: 290px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.3);
            max-height: 95vh;
            overflow-y: auto;
            font-size: 11px;
            min-width: 220px;
        }
        .control-panel h3 { 
            font-size: 13px; 
            color: #1a2a3a; 
            border-bottom: 2px solid #2c6b9e; 
            padding-bottom: 6px; 
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .control-panel label { 
            font-weight: 600; 
            font-size: 10px; 
            color: #2c3e50; 
            display: block; 
            margin-top: 5px; 
            margin-bottom: 2px; 
        }
        .control-panel select { 
            width: 100%; 
            padding: 4px 6px; 
            border-radius: 5px; 
            border: 1px solid #ccc; 
            background: white; 
            font-size: 10px; 
            cursor: pointer; 
            margin-bottom: 2px;
        }
        .control-panel select:focus { 
            outline: none; 
            border-color: #2c6b9e; 
            box-shadow: 0 0 0 2px rgba(44,107,158,0.2); 
        }
        .control-panel select:disabled {
            background: #e9ecef;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .control-panel select option { font-size: 10px; }

        .btn-group { 
            display: flex; 
            gap: 4px; 
            margin-top: 5px; 
            flex-wrap: wrap;
        }
        .btn-group button { 
            flex: 1; 
            min-width: 35px;
            padding: 4px 6px; 
            border-radius: 5px; 
            border: none; 
            font-size: 9px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: all 0.2s; 
        }
        .btn-map { background: #6c757d; color: white; }
        .btn-map:hover { background: #5a6268; }
        .btn-map.active { background: #2c6b9e; }
        .btn-export { background: #28a745; color: white; }
        .btn-export:hover { background: #1e7e34; }
        .btn-geojson { background: #fd7e14; color: white; }
        .btn-geojson:hover { background: #e06b0a; }
        .btn-reset { background: #dc3545; color: white; }
        .btn-reset:hover { background: #c82333; }
        .btn-test { background: #6f42c1; color: white; }
        .btn-test:hover { background: #5a32a3; }

        .info-panel {
            margin-top: 8px;
            padding: 8px 10px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 3px solid #2c6b9e;
            font-size: 10px;
            line-height: 1.5;
            max-height: 280px;
            overflow-y: auto;
        }
        .info-panel h4 { 
            font-size: 11px; 
            color: #1a2a3a; 
            margin-bottom: 4px;
            border-bottom: 1px dashed #ddd;
            padding-bottom: 3px;
        }
        .info-panel .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 3px;
            margin-top: 4px;
        }
        .info-panel .stat-item {
            background: white;
            padding: 3px 5px;
            border-radius: 3px;
            text-align: center;
            border: 1px solid #eee;
        }
        .info-panel .stat-item .num { 
            font-weight: 700; 
            color: #2c6b9e; 
            font-size: 12px; 
            display: block;
        }
        .info-panel .stat-item .label { 
            color: #666; 
            font-size: 7px; 
            text-transform: uppercase;
        }
        .info-panel .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            border-bottom: 1px dashed #f0f0f0;
        }
        .info-panel .stat-row .key { color: #555; }
        .info-panel .stat-row .value { font-weight: 600; color: #1a2a3a; }

        .footer { 
            position: absolute; 
            bottom: 6px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 1000; 
            background: rgba(0,0,0,0.7); 
            color: white; 
            padding: 3px 12px; 
            border-radius: 14px; 
            font-size: 9px; 
            backdrop-filter: blur(2px); 
            pointer-events: none; 
            white-space: nowrap; 
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: rgba(255,255,255,0.95);
            padding: 25px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
            text-align: center;
            min-width: 250px;
        }
        .loading .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2c6b9e;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading .title { font-weight: 600; font-size: 14px; color: #1a2a3a; }
        .loading .subtitle { font-size: 11px; color: #666; margin-top: 4px; }
        .loading .error { color: #dc3545; font-size: 11px; margin-top: 8px; }
        .loading .success { color: #28a745; font-size: 11px; margin-top: 8px; }
        .loading .progress { 
            width: 100%; 
            height: 4px; 
            background: #e9ecef; 
            border-radius: 2px; 
            margin-top: 10px;
            overflow: hidden;
        }
        .loading .progress-bar {
            height: 100%;
            background: #2c6b9e;
            width: 0%;
            transition: width 0.3s;
        }

        .debug-panel {
            position: absolute;
            bottom: 40px;
            left: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            padding: 8px 12px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 9px;
            max-width: 350px;
            max-height: 150px;
            overflow-y: auto;
            display: none;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .control-panel { 
                top: 6px; 
                right: 6px; 
                max-width: 195px; 
                padding: 6px 8px; 
                font-size: 9px;
            }
            .control-panel h3 { font-size: 11px; }
            .info-panel .stat-grid { grid-template-columns: 1fr 1fr; }
            .info-panel .stat-item .num { font-size: 10px; }
            .loading { min-width: 180px; padding: 15px 20px; }
            .debug-panel { max-width: 180px; font-size: 8px; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="title" id="loading-title">Cargando datos...</div>
        <div class="subtitle" id="loading-subtitle">Provincias, Distritos, Corregimientos...</div>
        <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
        <div id="loading-status"></div>
    </div>

    <!-- Debug Panel -->
    <div class="debug-panel" id="debugPanel"></div>

    <div class="control-panel">
        <h3>🗺️ Panamá - División Administrativa</h3>

        <label>🗺️ Mapa base:</label>
        <div class="btn-group">
            <button class="btn-map active" onclick="cambiarMapa('satellite')" id="btn-satellite">🛰️</button>
            <button class="btn-map" onclick="cambiarMapa('osm')" id="btn-osm">🌍</button>
            <button class="btn-map" onclick="cambiarMapa('topo')" id="btn-topo">🗺️</button>
        </div>

        <div style="margin-top:6px;">
            <label>📍 Provincia:</label>
            <select id="provincia-select" onchange="cargarDistritos()">
                <option value="">Seleccionar provincia...</option>
            </select>

            <label>📍 Distrito:</label>
            <select id="distrito-select" onchange="cargarCorregimientos()" disabled>
                <option value="">Seleccionar distrito...</option>
            </select>

            <label>📍 Corregimiento:</label>
            <select id="corregimiento-select" onchange="cargarLugares()" disabled>
                <option value="">Seleccionar corregimiento...</option>
            </select>

            <label>📍 Lugar Poblado:</label>
            <select id="lugar-select" onchange="cargarBarrios()" disabled>
                <option value="">Seleccionar lugar poblado...</option>
            </select>

            <label>📍 Barrio:</label>
            <select id="barrio-select" onchange="seleccionarBarrio()" disabled>
                <option value="">Seleccionar barrio...</option>
            </select>
        </div>

        <div class="btn-group" style="margin-top:6px;">
            <button class="btn-geojson" onclick="exportarGeoJSON()">📥 GeoJSON</button>
            <button class="btn-export" onclick="exportarCSV()">📊 CSV</button>
            <button class="btn-reset" onclick="resetearMapa()">🔄 Reset</button>
            <button class="btn-test" onclick="testGeometrias()">🔍 Test</button>
        </div>

        <div class="info-panel" id="info-panel">
            <h4>📊 Información del área seleccionada</h4>
            <div id="info-content">
                <p style="color:#888;font-style:italic;text-align:center;font-size:9px;padding:10px 0;">
                    Selecciona una provincia para ver los datos del censo
                </p>
            </div>
        </div>
    </div>

    <div class="footer">Datos: Censo 2023 – Raúl Viquez</div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // ================================================================
        // 1. DEBUG - SIN SOBRESCRIBIR console
        // ================================================================
        function debugLog(msg, type = 'info') {
            const panel = document.getElementById('debugPanel');
            panel.style.display = 'block';
            const colors = { info: '#0f0', warn: '#ff0', error: '#f44', success: '#0f0' };
            const prefix = { info: 'ℹ️', warn: '⚠️', error: '❌', success: '✅' };
            const time = new Date().toLocaleTimeString();
            panel.innerHTML += `<div style="color:${colors[type] || '#0f0'};border-bottom:1px solid #333;padding:1px 0;">
                ${prefix[type] || 'ℹ️'} ${time}: ${msg}
            </div>`;
            panel.scrollTop = panel.scrollHeight;
            // Usar console.log directamente (sin variable intermedia)
            console.log(`[${type.toUpperCase()}] ${msg}`);
        }

        // ================================================================
        // 2. MAPA
        // ================================================================
        const map = L.map('map', { center: [8.5, -80.0], zoom: 7 });

        const layers = {
            satellite: L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: 'Tiles &copy; Esri',
                    maxZoom: 19
                }
            ),
            osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }),
            topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenTopoMap',
                maxZoom: 17
            })
        };

        layers.satellite.addTo(map);

        // ================================================================
        // 3. VARIABLES GLOBALES
        // ================================================================
        let geoData = {
            provincias: null,
            distritos: null,
            corregimientos: null,
            lugares: null,
            barrios: null
        };

        let currentLayerGeo = null;
        let highlightLayer = null;
        let currentSelected = {
            provincia: null,
            distrito: null,
            corregimiento: null,
            lugar: null,
            barrio: null
        };

        const colores = [
            '#2c6b9e', '#28a745', '#dc3545', '#fd7e14', '#6f42c1',
            '#20c997', '#e83e8c', '#17a2b8', '#ffc107', '#6c757d',
            '#d63384', '#0dcaf0', '#198754', '#ff6b35', '#7b2fbe'
        ];

        let datosCargados = 0;
        const totalArchivos = 5;

        // ================================================================
        // 4. FUNCIONES DE CARGA CON DIAGNÓSTICO
        // ================================================================
        function actualizarProgress() {
            const pct = Math.round((datosCargados / totalArchivos) * 100);
            document.getElementById('progress-bar').style.width = pct + '%';
            document.getElementById('loading-subtitle').textContent = 
                `Cargando ${datosCargados}/${totalArchivos} archivos...`;
        }

        async function cargarGeoJSON(tipo, url) {
            try {
                debugLog(`Cargando ${tipo} desde ${url}...`, 'info');
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                if (!data || !data.features) {
                    throw new Error('Formato inválido: no tiene "features"');
                }
                
                // Verificar geometría
                let geometriasValidas = 0;
                let geometriasInvalidas = 0;
                data.features.forEach(f => {
                    if (f.geometry && f.geometry.type) {
                        geometriasValidas++;
                    } else {
                        geometriasInvalidas++;
                    }
                });
                
                debugLog(`✅ ${tipo} cargado: ${data.features.length} registros`, 'success');
                debugLog(`   📐 Geometrías válidas: ${geometriasValidas}, inválidas: ${geometriasInvalidas}`, 'info');
                
                // Mostrar ejemplo de geometría
                if (data.features.length > 0 && data.features[0].geometry) {
                    const geom = data.features[0].geometry;
                    debugLog(`   📐 Ejemplo geometría: ${geom.type}`, 'info');
                    if (geom.type === 'MultiPolygon' && geom.coordinates && geom.coordinates.length > 0) {
                        debugLog(`   📐 Primer polígono: ${geom.coordinates[0].length} anillos`, 'info');
                    } else if (geom.type === 'Polygon' && geom.coordinates && geom.coordinates.length > 0) {
                        debugLog(`   📐 Primer polígono: ${geom.coordinates[0].length} puntos`, 'info');
                    }
                }
                
                // Mostrar campos disponibles
                if (data.features.length > 0 && data.features[0].properties) {
                    const campos = Object.keys(data.features[0].properties);
                    debugLog(`   📋 Campos: ${campos.slice(0, 10).join(', ')}${campos.length > 10 ? '...' : ''}`, 'info');
                }
                
                geoData[tipo] = data;
                datosCargados++;
                actualizarProgress();
                return data;
            } catch (error) {
                debugLog(`Error cargando ${tipo}: ${error.message}`, 'error');
                datosCargados++;
                actualizarProgress();
                return null;
            }
        }

        async function cargarTodosLosDatos() {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            document.getElementById('loading-title').textContent = 'Cargando datos...';
            document.getElementById('loading-status').innerHTML = '';
            document.getElementById('progress-bar').style.width = '0%';

            debugLog('🚀 Iniciando carga de todos los datos...', 'info');

            // Cargar todos los archivos
            await Promise.all([
                cargarGeoJSON('provincias', 'provincias.geojson'),
                cargarGeoJSON('distritos', 'distritos.geojson'),
                cargarGeoJSON('corregimientos', 'corregimientos.geojson'),
                cargarGeoJSON('lugares', 'lugares_poblados.geojson'),
                cargarGeoJSON('barrios', 'barrios.geojson')
            ]);

            // Verificar si se cargaron las provincias
            if (!geoData.provincias) {
                document.getElementById('loading-title').textContent = '❌ Error crítico';
                document.getElementById('loading-subtitle').textContent = 'No se pudo cargar provincias.geojson';
                document.getElementById('loading-status').innerHTML = `
                    <div class="error">
                        Verifica que el archivo <strong>provincias.geojson</strong><br>
                        esté en la misma carpeta que este HTML
                    </div>
                    <button onclick="location.reload()" style="margin-top:10px;padding:6px 20px;border:none;background:#2c6b9e;color:white;border-radius:5px;cursor:pointer;font-size:12px;">
                        🔄 Reintentar
                    </button>
                `;
                debugLog('❌ Error crítico: no se cargaron provincias', 'error');
                return;
            }

            // Poblar select de provincias
            const select = document.getElementById('provincia-select');
            select.innerHTML = '<option value="">Seleccionar provincia...</option>';
            
            const features = geoData.provincias.features;
            features.sort((a, b) => {
                const nomA = a.properties.PROV_NOMB || '';
                const nomB = b.properties.PROV_NOMB || '';
                return nomA.localeCompare(nomB);
            });
            
            features.forEach((f, index) => {
                const nombre = f.properties.PROV_NOMB || 'Provincia ' + (index + 1);
                const id = f.properties.PROV_ID || index;
                const option = document.createElement('option');
                option.value = id;
                option.textContent = nombre;
                option.dataset.feature = JSON.stringify(f);
                select.appendChild(option);
            });

            debugLog(`✅ Select de provincias poblado con ${features.length} opciones`, 'success');

            // Mostrar todas las provincias en el mapa
            mostrarTodasLasProvincias();

            // Finalizar
            document.getElementById('loading-title').textContent = '✅ ¡Listo!';
            document.getElementById('loading-subtitle').textContent = `${features.length} provincias cargadas`;
            document.getElementById('loading-status').innerHTML = `
                <div class="success">
                    ${geoData.distritos ? geoData.distritos.features.length + ' distritos' : ''}
                    ${geoData.corregimientos ? ' · ' + geoData.corregimientos.features.length + ' corregimientos' : ''}
                </div>
            `;

            debugLog('✅ Carga completada exitosamente', 'success');

            setTimeout(() => {
                loading.style.display = 'none';
            }, 800);
        }

        // ================================================================
        // 5. MOSTRAR EN MAPA CON ESTILO VISIBLE
        // ================================================================
        function mostrarTodasLasProvincias() {
            if (!geoData.provincias) {
                debugLog('No hay provincias para mostrar', 'warn');
                return;
            }
            
            if (currentLayerGeo) {
                map.removeLayer(currentLayerGeo);
                currentLayerGeo = null;
            }

            const features = geoData.provincias.features;
            debugLog(`Mostrando ${features.length} provincias en el mapa`, 'info');
            
            // Verificar que las geometrías sean válidas
            let featuresValidas = features.filter(f => f.geometry && f.geometry.type);
            if (featuresValidas.length === 0) {
                debugLog('⚠️ Ninguna provincia tiene geometría válida', 'error');
                document.getElementById('info-content').innerHTML = `
                    <p style="color:#dc3545;font-size:10px;">
                        ⚠️ Las provincias no tienen geometría válida.<br>
                        Verifica el archivo GeoJSON.
                    </p>
                `;
                return;
            }
            
            if (featuresValidas.length < features.length) {
                debugLog(`⚠️ ${features.length - featuresValidas.length} provincias sin geometría`, 'warn');
            }
            
            currentLayerGeo = L.geoJSON({
                type: 'FeatureCollection',
                features: featuresValidas
            }, {
                style: function(feature, index) {
                    const idx = index % colores.length;
                    return {
                        fillColor: colores[idx],
                        fillOpacity: 0.35,
                        color: colores[idx],
                        weight: 2,
                        opacity: 0.8
                    };
                },
                onEachFeature: function(f, layer) {
                    const props = f.properties;
                    const nombre = props.PROV_NOMB || 'Provincia';
                    layer.bindTooltip(nombre, { permanent: false, direction: 'center' });
                    layer.on('click', function() {
                        const select = document.getElementById('provincia-select');
                        for (let i = 0; i < select.options.length; i++) {
                            if (select.options[i].textContent === nombre) {
                                select.selectedIndex = i;
                                cargarDistritos();
                                break;
                            }
                        }
                    });
                }
            }).addTo(map);

            debugLog(`✅ ${featuresValidas.length} provincias mostradas en el mapa`, 'success');

            const bounds = L.geoJSON({ type: 'FeatureCollection', features: featuresValidas }).getBounds();
            if (bounds.isValid()) {
                map.fitBounds(bounds, { padding: [20, 20] });
                debugLog('📍 Zoom ajustado a todas las provincias', 'info');
            } else {
                debugLog('⚠️ No se pudo ajustar el zoom', 'warn');
            }
        }

        function mostrarPoligono(feature) {
            if (!feature) {
                debugLog('No hay feature para mostrar', 'warn');
                return;
            }
            
            // Verificar geometría
            if (!feature.geometry || !feature.geometry.type) {
                debugLog('⚠️ El feature no tiene geometría válida', 'error');
                return;
            }
            
            if (currentLayerGeo) {
                map.removeLayer(currentLayerGeo);
                currentLayerGeo = null;
            }
            if (highlightLayer) {
                map.removeLayer(highlightLayer);
                highlightLayer = null;
            }

            debugLog(`Mostrando polígono: ${feature.properties.PROV_NOMB || feature.properties.DIST_NOMB || 'Área'}`, 'info');

            currentLayerGeo = L.geoJSON(feature, {
                style: {
                    fillColor: '#2c6b9e',
                    fillOpacity: 0.35,
                    color: '#1a4a7a',
                    weight: 3,
                    opacity: 0.9
                },
                onEachFeature: function(f, layer) {
                    const props = f.properties;
                    const nombre = props.PROV_NOMB || props.DIST_NOMB || props.CORR_NOMB || 
                                  props.LUPO_NOMB || props.BARR_NOMB || 'Área';
                    layer.bindTooltip(nombre, { permanent: false, direction: 'center' });
                }
            }).addTo(map);

            highlightLayer = L.geoJSON(feature, {
                style: {
                    fillColor: 'transparent',
                    color: '#ff6b35',
                    weight: 4,
                    opacity: 0.8,
                    dashArray: '6, 4'
                }
            }).addTo(map);

            debugLog('✅ Polígono mostrado con borde resaltado', 'success');
            zoomAFeature(feature);
        }

        function mostrarTodosLosPoligonos(features, titulo) {
            if (!features || features.length === 0) {
                debugLog(`No hay ${titulo} para mostrar`, 'warn');
                if (currentLayerGeo) {
                    map.removeLayer(currentLayerGeo);
                    currentLayerGeo = null;
                }
                return;
            }
            
            // Filtrar features con geometría válida
            const featuresValidas = features.filter(f => f.geometry && f.geometry.type);
            if (featuresValidas.length === 0) {
                debugLog(`⚠️ Ningún ${titulo} tiene geometría válida`, 'error');
                return;
            }
            
            if (currentLayerGeo) {
                map.removeLayer(currentLayerGeo);
                currentLayerGeo = null;
            }
            if (highlightLayer) {
                map.removeLayer(highlightLayer);
                highlightLayer = null;
            }

            debugLog(`Mostrando ${featuresValidas.length} ${titulo} en el mapa`, 'info');

            currentLayerGeo = L.geoJSON({
                type: 'FeatureCollection',
                features: featuresValidas
            }, {
                style: function(feature, index) {
                    const idx = index % colores.length;
                    return {
                        fillColor: colores[idx],
                        fillOpacity: 0.25,
                        color: colores[idx],
                        weight: 1.5,
                        opacity: 0.6
                    };
                },
                onEachFeature: function(f, layer) {
                    const props = f.properties;
                    const nombre = props.DIST_NOMB || props.CORR_NOMB || props.LUPO_NOMB || 
                                  props.BARR_NOMB || 'Área';
                    layer.bindTooltip(nombre, { permanent: false, direction: 'center' });
                    layer.on('click', function() {
                        mostrarInfo(props, titulo);
                        zoomAFeature(f);
                        // Resaltar el polígono seleccionado
                        if (highlightLayer) {
                            map.removeLayer(highlightLayer);
                        }
                        highlightLayer = L.geoJSON(f, {
                            style: {
                                fillColor: 'transparent',
                                color: '#ff6b35',
                                weight: 3,
                                opacity: 0.8,
                                dashArray: '5, 5'
                            }
                        }).addTo(map);
                    });
                }
            }).addTo(map);

            debugLog(`✅ ${featuresValidas.length} ${titulo} mostrados`, 'success');

            const bounds = L.geoJSON({ type: 'FeatureCollection', features: featuresValidas }).getBounds();
            if (bounds.isValid()) {
                map.fitBounds(bounds, { padding: [30, 30] });
            }
        }

        function zoomAFeature(feature) {
            try {
                const bounds = L.geoJSON(feature).getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
                    debugLog('📍 Zoom ajustado al área seleccionada', 'info');
                }
            } catch (e) {
                debugLog(`Error al hacer zoom: ${e.message}`, 'warn');
            }
        }

        // ================================================================
        // 6. SELECCIONES ENCADENADAS
        // ================================================================
        function cargarDistritos() {
            debugLog('Cargando distritos...', 'info');
            const provSelect = document.getElementById('provincia-select');
            const distSelect = document.getElementById('distrito-select');
            const corrSelect = document.getElementById('corregimiento-select');
            const lugarSelect = document.getElementById('lugar-select');
            const barrioSelect = document.getElementById('barrio-select');

            distSelect.innerHTML = '<option value="">Seleccionar distrito...</option>';
            corrSelect.innerHTML = '<option value="">Seleccionar corregimiento...</option>';
            lugarSelect.innerHTML = '<option value="">Seleccionar lugar poblado...</option>';
            barrioSelect.innerHTML = '<option value="">Seleccionar barrio...</option>';
            distSelect.disabled = true;
            corrSelect.disabled = true;
            lugarSelect.disabled = true;
            barrioSelect.disabled = true;

            const provId = provSelect.value;
            if (!provId || !geoData.distritos) {
                mostrarTodasLasProvincias();
                limpiarInfo();
                return;
            }

            const provFeature = provSelect.options[provSelect.selectedIndex]?.dataset?.feature;
            if (provFeature) {
                currentSelected.provincia = JSON.parse(provFeature);
                mostrarInfo(currentSelected.provincia.properties, 'Provincia');
                zoomAFeature(currentSelected.provincia);
                // Resaltar la provincia seleccionada
                if (highlightLayer) {
                    map.removeLayer(highlightLayer);
                }
                highlightLayer = L.geoJSON(currentSelected.provincia, {
                    style: {
                        fillColor: 'transparent',
                        color: '#ff6b35',
                        weight: 4,
                        opacity: 0.8,
                        dashArray: '6, 4'
                    }
                }).addTo(map);
            }

            const distritos = geoData.distritos.features.filter(f => {
                const p = f.properties;
                return p.PROV_ID === provId || p.ID_PROV === provId || p.COD_PROV === provId;
            });

            debugLog(`Distritos encontrados para provincia ${provId}: ${distritos.length}`, 'info');

            if (distritos.length === 0) {
                mostrarPoligono(currentSelected.provincia);
                return;
            }

            distritos.sort((a, b) => (a.properties.DIST_NOMB || '').localeCompare(b.properties.DIST_NOMB || ''));
            distritos.forEach(f => {
                const nombre = f.properties.DIST_NOMB || 'Sin nombre';
                const id = f.properties.DIST_ID || '';
                const option = document.createElement('option');
                option.value = id || nombre;
                option.textContent = nombre;
                option.dataset.feature = JSON.stringify(f);
                distSelect.appendChild(option);
            });

            distSelect.disabled = false;
            if (distritos.length > 0) {
                distSelect.selectedIndex = 1;
                cargarCorregimientos();
            }
            mostrarTodosLosPoligonos(distritos, 'Distritos');
        }

            const barrioSelect = document.getElementById('barrio-select');
            const barrioId = barrioSelect.value;
            if (!barrioId) return;

            if (barrioFeature) {
                currentSelected.barrio = JSON.parse(barrioFeature);
                mostrarInfo(currentSelected.barrio.properties, 'Barrio');
                zoomAFeature(currentSelected.barrio);
                mostrarPoligono(currentSelected.barrio);
            }
        }

        // ================================================================
        // 7. PANEL DE INFORMACIÓN CON CONVERSIÓN A NÚMEROS
        // ================================================================
        function mostrarInfo(props, titulo) {
            const container = document.getElementById('info-content');

            const nombre = props.PROV_NOMB || props.DIST_NOMB || props.CORR_NOMB || 
                           props.LUPO_NOMB || props.BARR_NOMB || 'Sin nombre';
            const id = props.PROV_ID || props.DIST_ID || props.CORR_ID || 
                       props.LUPO_ID || props.BARR_ID || 'N/A';
            
            // Convertir a números con parseFloat
            const poblacion = parseFloat(props.N_PERSONAS) || 0;
            const viviendas = parseFloat(props.N_VIVIENDA) || 0;
            const area = parseFloat(props.AREA) || 0;
            const hombres = parseFloat(props.P_HOMBRES) || 0;
            const mujeres = parseFloat(props.P_MUJERES) || 0;
            const analf = parseFloat(props.ANALFAB) || 0;
            const desocup = parseFloat(props.DESOCUP) || 0;
            const sinAgua = parseFloat(props.SIN_AGUA) || 0;
            const sinLuz = parseFloat(props.SIN_LUZ) || 0;
            const sinInternet = parseFloat(props.SIN_INTERN) || 0;
            const conDisc = parseFloat(props.CON_DISC) || 0;
            const mayor18 = parseFloat(props.MAYOR_18) || 0;
            const sinServSan = parseFloat(props.SIN_SER_SA) || 0;

            debugLog(`Mostrando info de ${titulo}: ${nombre} (Población: ${poblacion})`, 'info');

            let html = `<h4>${titulo}: ${nombre}</h4>`;

            // Grid de estadísticas principales
            html += `<div class="stat-grid">
                <div class="stat-item">
                    <span class="num">${poblacion > 0 ? poblacion.toLocaleString() : 'N/D'}</span>
                    <span class="label">Población</span>
                </div>
                <div class="stat-item">
                    <span class="num">${viviendas > 0 ? viviendas.toLocaleString() : 'N/D'}</span>
                    <span class="label">Viviendas</span>
                </div>
                <div class="stat-item">
                    <span class="num">${viviendas > 0 && poblacion > 0 ? (poblacion / viviendas).toFixed(2) : 'N/D'}</span>
                    <span class="label">Pers./Viv.</span>
                </div>
            </div>`;

            // Detalles
            html += `<div style="margin-top:4px;">`;
            const detalles = [
                ['Hombres', hombres > 0 ? hombres.toLocaleString() : null],
                ['Mujeres', mujeres > 0 ? mujeres.toLocaleString() : null],
                ['Mayores de 18', mayor18 > 0 ? mayor18.toLocaleString() : null],
                ['Área (km²)', area > 0 ? area.toFixed(2) : null],
                ['Analfabetismo', analf > 0 ? analf.toFixed(1) + '%' : null],
                ['Desocupación', desocup > 0 ? desocup.toFixed(1) + '%' : null],
                ['Sin agua', sinAgua > 0 ? sinAgua.toFixed(1) + '%' : null],
                ['Sin luz', sinLuz > 0 ? sinLuz.toFixed(1) + '%' : null],
                ['Sin internet', sinInternet > 0 ? sinInternet.toFixed(1) + '%' : null],
                ['Sin servicio sanitario', sinServSan > 0 ? sinServSan.toFixed(1) + '%' : null],
                ['Con discapacidad', conDisc > 0 ? conDisc.toLocaleString() : null]
            ];
            detalles.forEach(([key, value]) => {
                if (value !== null) {
                    html += `<div class="stat-row">
                        <span class="key">${key}</span>
                        <span class="value">${value}</span>
                    </div>`;
                }
            });
            html += `</div>`;

            if (id !== 'N/A') {
                html += `<div style="margin-top:3px;font-size:8px;color:#888;border-top:1px dashed #ddd;padding-top:3px;">
                    ID: ${id}
                </div>`;
            }

            container.innerHTML = html;
        }

        function limpiarInfo() {
            document.getElementById('info-content').innerHTML = `
                <p style="color:#888;font-style:italic;text-align:center;font-size:9px;padding:10px 0;">
                    Selecciona una provincia para ver los datos del censo
                </p>
            `;
        }

        // ================================================================
        // 8. FUNCIÓN DE TEST PARA DIAGNÓSTICO
        // ================================================================
        function testGeometrias() {
            debugLog('🔍 Ejecutando test de geometrías...', 'info');
            
            const tipos = ['provincias', 'distritos', 'corregimientos', 'lugares', 'barrios'];
            let totalValidas = 0;
            let totalInvalidas = 0;
            
            tipos.forEach(tipo => {
                const data = geoData[tipo];
                if (!data) {
                    debugLog(`❌ ${tipo}: No cargado`, 'error');
                    return;
                }
                
                let validas = 0;
                let invalidas = 0;
                data.features.forEach(f => {
                    if (f.geometry && f.geometry.type && f.geometry.coordinates) {
                        validas++;
                    } else {
                        invalidas++;
                    }
                });
                totalValidas += validas;
                totalInvalidas += invalidas;
                debugLog(`${tipo}: ${validas} válidas, ${invalidas} inválidas`, validas > 0 ? 'success' : 'error');
            });
            
            debugLog(`📊 Total: ${totalValidas} geometrías válidas, ${totalInvalidas} inválidas`, totalValidas > 0 ? 'success' : 'error');
            
            // Intentar mostrar una provincia de prueba si hay geometrías válidas
            if (geoData.provincias) {
                const validas = geoData.provincias.features.filter(f => f.geometry && f.geometry.type);
                if (validas.length > 0) {
                    debugLog(`✅ Mostrando primera provincia como prueba`, 'success');
                    mostrarPoligono(validas[0]);
                }
            }
        }

        // ================================================================
        // 9. EXPORTAR
        // ================================================================
        function exportarGeoJSON() {
            if (!currentLayerGeo) {
                alert('No hay ningún polígono seleccionado para exportar.');
                return;
            }

            const data = currentLayerGeo.toGeoJSON();
            const nombre = currentSelected.provincia?.properties?.PROV_NOMB || 
                          currentSelected.distrito?.properties?.DIST_NOMB ||
                          currentSelected.corregimiento?.properties?.CORR_NOMB ||
                          'area_seleccionada';

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${nombre.toLowerCase().replace(/\s+/g, '_')}.geojson`;
            link.click();
            URL.revokeObjectURL(link.href);
            debugLog(`📥 GeoJSON exportado: ${nombre}`, 'success');
        }

        function exportarCSV() {
            const props = currentSelected.provincia?.properties || 
                         currentSelected.distrito?.properties ||
                         currentSelected.corregimiento?.properties ||
                         currentSelected.lugar?.properties ||
                         currentSelected.barrio?.properties;

            if (!props) {
                alert('No hay datos para exportar.');
                return;
            }

            const headers = Object.keys(props);
            const values = headers.map(h => props[h] !== undefined ? props[h] : '');
            
            let csv = headers.join(',') + '\n';
            csv += values.join(',') + '\n';

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `datos_seleccionados.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
            debugLog('📊 CSV exportado', 'success');
        }

        // ================================================================
        // 10. MAPA BASE
        // ================================================================
        function cambiarMapa(tipo) {
            Object.keys(layers).forEach(key => {
                if (map.hasLayer(layers[key])) map.removeLayer(layers[key]);
            });
            if (layers[tipo]) layers[tipo].addTo(map);
            document.querySelectorAll('.btn-map').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${tipo}`).classList.add('active');
            debugLog(`Mapa cambiado a: ${tipo}`, 'info');
        }

        // ================================================================
        // 11. RESET
        // ================================================================
        function resetearMapa() {
            document.getElementById('provincia-select').selectedIndex = 0;
            document.getElementById('distrito-select').innerHTML = '<option value="">Seleccionar distrito...</option>';
            document.getElementById('corregimiento-select').innerHTML = '<option value="">Seleccionar corregimiento...</option>';
            document.getElementById('lugar-select').innerHTML = '<option value="">Seleccionar lugar poblado...</option>';
            document.getElementById('barrio-select').innerHTML = '<option value="">Seleccionar barrio...</option>';
            
            document.getElementById('distrito-select').disabled = true;
            document.getElementById('corregimiento-select').disabled = true;
            document.getElementById('lugar-select').disabled = true;
            document.getElementById('barrio-select').disabled = true;

            if (currentLayerGeo) {
                map.removeLayer(currentLayerGeo);
                currentLayerGeo = null;
            }
            if (highlightLayer) {
                map.removeLayer(highlightLayer);
                highlightLayer = null;
            }
            currentSelected = { provincia: null, distrito: null, corregimiento: null, lugar: null, barrio: null };
            limpiarInfo();

            if (geoData.provincias) {
                const bounds = L.geoJSON(geoData.provincias).getBounds();
                if (bounds.isValid()) map.fitBounds(bounds, { padding: [20, 20] });
                mostrarTodasLasProvincias();
            } else {
                map.setView([8.5, -80.0], 7);
            }
            debugLog('🔄 Mapa reseteado', 'info');
        }

        // ================================================================
        // 12. INICIO
        // ================================================================
        // Exponer funciones globales
        window.cambiarMapa = cambiarMapa;
        window.cargarDistritos = cargarDistritos;
        window.cargarCorregimientos = cargarCorregimientos;
        window.cargarLugares = cargarLugares;
        window.cargarBarrios = cargarBarrios;
        window.seleccionarBarrio = seleccionarBarrio;
        window.exportarGeoJSON = exportarGeoJSON;
        window.exportarCSV = exportarCSV;
        window.resetearMapa = resetearMapa;
        window.testGeometrias = testGeometrias;

        console.log('🗺️ Explorador Administrativo de Panamá');
        console.log('📌 Cargando datos...');

        cargarTodosLosDatos();
    </script>
