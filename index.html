<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panamá - División Administrativa</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; }
        #map { height: 100vh; width: 100%; }

        .control-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            padding: 12px 14px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-width: 330px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.3);
            max-height: 95vh;
            overflow-y: auto;
            font-size: 11px;
            min-width: 220px;
        }
        .control-panel h3 { 
            font-size: 13px; 
            color: #1a2a3a; 
            border-bottom: 2px solid #2c6b9e; 
            padding-bottom: 6px; 
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .control-panel .nivel-actual {
            font-size: 10px;
            color: #2c6b9e;
            font-weight: 600;
            background: #e8f0fe;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 4px;
        }
        .control-panel label { 
            font-weight: 600; 
            font-size: 10px; 
            color: #2c3e50; 
            display: block; 
            margin-top: 5px; 
            margin-bottom: 2px; 
        }
        .control-panel select { 
            width: 100%; 
            padding: 4px 6px; 
            border-radius: 5px; 
            border: 1px solid #ccc; 
            background: white; 
            font-size: 10px; 
            cursor: pointer; 
            margin-bottom: 2px;
        }
        .control-panel select:focus { 
            outline: none; 
            border-color: #2c6b9e; 
            box-shadow: 0 0 0 2px rgba(44,107,158,0.2); 
        }
        .control-panel select:disabled {
            background: #e9ecef;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-group { 
            display: flex; 
            gap: 4px; 
            margin-top: 5px; 
            flex-wrap: wrap;
        }
        .btn-group button { 
            flex: 1; 
            min-width: 35px;
            padding: 4px 6px; 
            border-radius: 5px; 
            border: none; 
            font-size: 9px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: all 0.2s; 
        }
        .btn-map { background: #6c757d; color: white; }
        .btn-map:hover { background: #5a6268; }
        .btn-map.active { background: #2c6b9e; }
        .btn-export { background: #28a745; color: white; }
        .btn-export:hover { background: #1e7e34; }
        .btn-geojson { background: #fd7e14; color: white; }
        .btn-geojson:hover { background: #e06b0a; }
        .btn-reset { background: #dc3545; color: white; }
        .btn-reset:hover { background: #c82333; }

        .info-panel {
            margin-top: 8px;
            padding: 8px 10px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 3px solid #2c6b9e;
            font-size: 10px;
            line-height: 1.5;
            max-height: 420px;
            overflow-y: auto;
        }
        .info-panel h4 { 
            font-size: 11px; 
            color: #1a2a3a; 
            margin-bottom: 4px;
            border-bottom: 1px dashed #ddd;
            padding-bottom: 3px;
        }
        .info-panel table {
            width: 100%;
            border-collapse: collapse;
            font-size: 9px;
        }
        .info-panel table tr:nth-child(even) {
            background: #f8f9fa;
        }
        .info-panel table tr:hover {
            background: #e9ecef;
        }
        .info-panel table td {
            padding: 3px 5px;
            border-bottom: 1px solid #eee;
        }
        .info-panel table .campo {
            color: #555;
            font-weight: 500;
            width: 55%;
        }
        .info-panel table .valor {
            font-weight: 600;
            color: #1a2a3a;
            text-align: right;
            width: 45%;
        }
        .info-panel .sin-datos {
            color: #888;
            font-style: italic;
            text-align: center;
            padding: 15px 0;
            font-size: 9px;
        }
        .info-panel .nivel-indicador {
            font-size: 8px;
            color: #888;
            text-align: center;
            padding: 4px 0;
            border-top: 1px dashed #ddd;
            margin-top: 4px;
        }

        .footer { 
            position: absolute; 
            bottom: 6px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 1000; 
            background: rgba(0,0,0,0.7); 
            color: white; 
            padding: 3px 12px; 
            border-radius: 14px; 
            font-size: 9px; 
            backdrop-filter: blur(2px); 
            pointer-events: none; 
            white-space: nowrap; 
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: rgba(255,255,255,0.95);
            padding: 25px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
            text-align: center;
            min-width: 250px;
        }
        .loading .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2c6b9e;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading .title { font-weight: 600; font-size: 14px; color: #1a2a3a; }
        .loading .subtitle { font-size: 11px; color: #666; margin-top: 4px; }
        .loading .progress { 
            width: 100%; 
            height: 4px; 
            background: #e9ecef; 
            border-radius: 2px; 
            margin-top: 10px;
            overflow: hidden;
        }
        .loading .progress-bar {
            height: 100%;
            background: #2c6b9e;
            width: 0%;
            transition: width 0.3s;
        }

        /* Tooltip personalizado para provincias */
        .leaflet-tooltip.provincia-tooltip {
            background: rgba(0,0,0,0.75);
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 4px;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        @media (max-width: 600px) {
            .control-panel { 
                top: 6px; 
                right: 6px; 
                max-width: 195px; 
                padding: 6px 8px; 
                font-size: 9px;
            }
            .control-panel h3 { font-size: 11px; }
            .loading { min-width: 180px; padding: 15px 20px; }
            .info-panel table { font-size: 8px; }
            .info-panel table .campo { width: 50%; }
            .info-panel table .valor { width: 50%; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="title" id="loading-title">Cargando datos...</div>
        <div class="subtitle" id="loading-subtitle">Provincias de Panamá</div>
        <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
        <div id="loading-status"></div>
    </div>

    <div class="control-panel">
        <h3>
            🗺️ Panamá 
            <span class="nivel-actual" id="nivel-actual">Provincias</span>
        </h3>

        <label>🗺️ Mapa base:</label>
        <div class="btn-group">
            <button class="btn-map active" onclick="cambiarMapa('satellite')" id="btn-satellite">🛰️</button>
            <button class="btn-map" onclick="cambiarMapa('osm')" id="btn-osm">🌍</button>
            <button class="btn-map" onclick="cambiarMapa('topo')" id="btn-topo">🗺️</button>
        </div>

        <div style="margin-top:6px;">
            <label id="label-selector">📍 Provincia:</label>
            <select id="selector-principal" onchange="seleccionarItem()">
                <option value="">Seleccionar...</option>
            </select>
        </div>

        <div id="sub-selectores">
            <!-- Se llenan dinámicamente -->
        </div>

        <div class="btn-group" style="margin-top:6px;">
            <button class="btn-geojson" onclick="exportarGeoJSON()">📥 GeoJSON</button>
            <button class="btn-export" onclick="exportarCSV()">📊 CSV</button>
            <button class="btn-reset" onclick="resetearMapa()">🔄 Reset</button>
        </div>

        <div class="info-panel" id="info-panel">
            <h4>📋 Datos del Censo</h4>
            <div id="info-content">
                <div class="sin-datos">
                    🗺️ Haz clic en una provincia en el mapa<br>
                    o selecciónala en el menú para ver los datos
                </div>
            </div>
        </div>
    </div>

    <div class="footer">Datos: Censo 2023 – Raúl Viquez</div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // ================================================================
        // 1. MAPA
        // ================================================================
        const map = L.map('map', { center: [8.5, -80.0], zoom: 7 });

        const layers = {
            satellite: L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: 'Tiles &copy; Esri',
                    maxZoom: 19
                }
            ),
            osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }),
            topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenTopoMap',
                maxZoom: 17
            })
        };

        layers.satellite.addTo(map);

        // ================================================================
        // 2. VARIABLES GLOBALES
        // ================================================================
        let datos = {
            provincias: null,
            distritos: null,
            corregimientos: null
        };

        let capaActual = null;
        let capaResaltado = null;
        let seleccionActual = null;
        let nivelActual = 'provincias'; // provincias | distritos | corregimientos
        let itemSeleccionado = null;

        const colores = [
            '#2c6b9e', '#28a745', '#dc3545', '#fd7e14', '#6f42c1',
            '#20c997', '#e83e8c', '#17a2b8', '#ffc107', '#6c757d',
            '#d63384', '#0dcaf0', '#198754', '#ff6b35', '#7b2fbe'
        ];

        let datosCargados = 0;
        const totalArchivos = 3;

        // ================================================================
        // 3. DICCIONARIO DE CAMPOS
        // ================================================================
        const descripcionCampos = {
            'PROV_ID': 'Código de Provincia',
            'PROV_NOMB': 'Nombre de Provincia',
            'PROV_LEY': 'Ley de Creación',
            'LEY_MOD_P': 'Ley Modificatoria',
            'GACETA_P': 'Gaceta Oficial',
            'GACE_MOD_P': 'Gaceta Modificatoria',
            'PERIMETRO': 'Perímetro (m)',
            'AREA': 'Área (m²)',
            'N_PERSONAS': 'Total de Personas',
            'P_HOMBRES': 'Cantidad de Hombres',
            'P_MUJERES': 'Cantidad de Mujeres',
            'MAYOR_18': 'Mayores de 18 años',
            'MENOS_PRIM': 'Menos de 3er grado de primaria',
            'AGROPEC': 'Actividades Agropecuarias',
            'NO_ECO_ACT': 'No Económicamente Activa',
            'DESOCUP': 'Desocupados',
            'ANALFAB': 'Analfabeta',
            'CON_DISC': 'Con alguna Discapacidad',
            'N_VIVIENDA': 'Total de Viviendas',
            'V_INDIV': 'Vivienda Individual',
            'V_IMPROV': 'Vivienda Improvisada',
            'V_APARTAM': 'Apartamento',
            'V_CUARTOS': 'Cuarto en Casa de Vecindad',
            'V_LOCAL': 'Local usado como Vivienda',
            'V_DAMNI': 'Damnificados',
            'V_INDIG': 'Indigentes',
            'V_COLECTIV': 'Vivienda Colectiva',
            'V_ASILOS': 'Asilos / Hogar de Ancianos',
            'V_PRO_ADOL': 'Protección de Niños y Adolescentes',
            'V_CARCELES': 'Cárceles / Centros de Custodia',
            'V_CON_REL': 'Conventos / Seminarios',
            'V_TRABA': 'Trabajaderos',
            'V_ALBE_MIG': 'Albergues de Migrantes',
            'V_REHABILI': 'Centros de Rehabilitación',
            'V_OTR_COLE': 'Otra Vivienda Colectiva',
            'TOTA_VIV_P': 'Viviendas con Ocupantes Presentes',
            'CON_PISO_T': 'Con Piso de Tierra',
            'SIN_AGUA': 'Sin Agua Potable',
            'SIN_SER_SA': 'Sin Servicio Sanitario',
            'SIN_LUZ': 'Sin Luz Eléctrica',
            'COC_LEÑA': 'Cocinan con Leña',
            'COC_CARBON': 'Cocinan con Carbón',
            'SIN_TV': 'Sin Televisor',
            'SIN_RADIO': 'Sin Radio',
            'SIN_TEL_RE': 'Sin Teléfono Residencial',
            'SIN_TEL_CE': 'Sin Teléfono Celular Activo',
            'SIN_INTERN': 'Sin Acceso a Internet',
            'ID1': 'ID Interno'
        };

        // ================================================================
        // 4. CARGA DE DATOS
        // ================================================================
        function actualizarProgress() {
            const pct = Math.round((datosCargados / totalArchivos) * 100);
            document.getElementById('progress-bar').style.width = pct + '%';
            document.getElementById('loading-subtitle').textContent = 
                `Cargando ${datosCargados}/${totalArchivos} archivos...`;
        }

        async function cargarGeoJSON(tipo, url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                datos[tipo] = data;
                datosCargados++;
                actualizarProgress();
                console.log(`✅ ${tipo} cargado: ${data.features.length} registros`);
                return data;
            } catch (error) {
                console.warn(`⚠️ Error cargando ${tipo}: ${error.message}`);
                datosCargados++;
                actualizarProgress();
                return null;
            }
        }

        async function cargarTodosLosDatos() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('progress-bar').style.width = '0%';

            await Promise.all([
                cargarGeoJSON('provincias', 'provincias.geojson'),
                cargarGeoJSON('distritos', 'distritos.geojson'),
                cargarGeoJSON('corregimientos', 'corregimientos.geojson')
            ]);

            if (!datos.provincias) {
                document.getElementById('loading').innerHTML = `
                    <div class="title" style="color:#dc3545;">❌ Error</div>
                    <div class="subtitle">No se pudo cargar provincias.geojson</div>
                    <button onclick="location.reload()" style="margin-top:10px;padding:6px 20px;border:none;background:#2c6b9e;color:white;border-radius:5px;cursor:pointer;font-size:12px;">
                        🔄 Reintentar
                    </button>
                `;
                return;
            }

            // Poblar selector de provincias
            const select = document.getElementById('selector-principal');
            select.innerHTML = '<option value="">Seleccionar provincia...</option>';
            
            const features = datos.provincias.features;
            features.sort((a, b) => {
                const nomA = a.properties.PROV_NOMB || '';
                const nomB = b.properties.PROV_NOMB || '';
                return nomA.localeCompare(nomB);
            });
            
            features.forEach((f, index) => {
                const nombre = f.properties.PROV_NOMB || 'Provincia ' + (index + 1);
                const id = f.properties.PROV_ID || index;
                const option = document.createElement('option');
                option.value = id;
                option.textContent = nombre;
                option.dataset.feature = JSON.stringify(f);
                option.dataset.tipo = 'provincia';
                select.appendChild(option);
            });

            // Mostrar provincias en el mapa
            mostrarNivel('provincias');

            document.getElementById('loading').style.display = 'none';
            document.getElementById('nivel-actual').textContent = 'Provincias';
        }

        // ================================================================
        // 5. MOSTRAR EN MAPA
        // ================================================================
        function mostrarNivel(nivel, filtroId = null) {
            if (capaActual) {
                map.removeLayer(capaActual);
                capaActual = null;
            }
            if (capaResaltado) {
                map.removeLayer(capaResaltado);
                capaResaltado = null;
            }

            let features = [];
            let titulo = '';

            if (nivel === 'provincias') {
                features = datos.provincias?.features || [];
                titulo = 'Provincias';
                nivelActual = 'provincias';
                document.getElementById('nivel-actual').textContent = 'Provincias';
                document.getElementById('label-selector').textContent = '📍 Provincia:';
            } else if (nivel === 'distritos') {
                if (!datos.distritos) {
                    console.warn('No hay datos de distritos');
                    return;
                }
                features = datos.distritos.features.filter(f => {
                    const p = f.properties;
                    return p.PROV_ID === filtroId || p.ID_PROV === filtroId || p.COD_PROV === filtroId;
                });
                titulo = 'Distritos';
                nivelActual = 'distritos';
                document.getElementById('nivel-actual').textContent = 'Distritos';
                document.getElementById('label-selector').textContent = '📍 Distrito:';
            } else if (nivel === 'corregimientos') {
                if (!datos.corregimientos) {
                    console.warn('No hay datos de corregimientos');
                    return;
                }
                features = datos.corregimientos.features.filter(f => {
                    const p = f.properties;
                    return p.DIST_ID === filtroId || p.ID_DIST === filtroId || p.COD_DIST === filtroId;
                });
                titulo = 'Corregimientos';
                nivelActual = 'corregimientos';
                document.getElementById('nivel-actual').textContent = 'Corregimientos';
                document.getElementById('label-selector').textContent = '📍 Corregimiento:';
            }

            if (features.length === 0) {
                console.warn(`No hay ${titulo} para mostrar`);
                return;
            }

            // Filtrar features con geometría válida
            const validas = features.filter(f => f.geometry && f.geometry.type);
            if (validas.length === 0) {
                console.warn(`Ningún ${titulo} tiene geometría válida`);
                return;
            }

            capaActual = L.geoJSON({
                type: 'FeatureCollection',
                features: validas
            }, {
                style: function(feature, index) {
                    const idx = index % colores.length;
                    return {
                        fillColor: colores[idx],
                        fillOpacity: 0.3,
                        color: '#ffffff',
                        weight: 1.5,
                        opacity: 0.6
                    };
                },
                onEachFeature: function(f, layer) {
                    const props = f.properties;
                    let nombre = props.PROV_NOMB || props.DIST_NOMB || props.CORR_NOMB || 'Área';
                    
                    // Tooltip con nombre
                    layer.bindTooltip(nombre, { 
                        permanent: false, 
                        direction: 'center',
                        className: 'provincia-tooltip'
                    });
                    
                    // Al hacer clic
                    layer.on('click', function() {
                        if (nivel === 'provincias') {
                            // Seleccionar provincia y cargar distritos
                            const select = document.getElementById('selector-principal');
                            for (let i = 0; i < select.options.length; i++) {
                                if (select.options[i].textContent === nombre) {
                                    select.selectedIndex = i;
                                    seleccionarItem();
                                    break;
                                }
                            }
                        } else if (nivel === 'distritos') {
                            // Seleccionar distrito y cargar corregimientos
                            cargarSubNivel('distritos', props);
                        } else if (nivel === 'corregimientos') {
                            // Mostrar datos del corregimiento
                            mostrarDatosTabla(props, 'Corregimiento');
                            resaltarFeature(f);
                        }
                    });
                }
            }).addTo(map);

            // Ajustar zoom
            const bounds = L.geoJSON({ type: 'FeatureCollection', features: validas }).getBounds();
            if (bounds.isValid()) {
                map.fitBounds(bounds, { padding: [30, 30] });
            }

            console.log(`✅ ${validas.length} ${titulo} mostrados`);
        }

        function resaltarFeature(feature) {
            if (capaResaltado) {
                map.removeLayer(capaResaltado);
                capaResaltado = null;
            }
            
            capaResaltado = L.geoJSON(feature, {
                style: {
                    fillColor: 'transparent',
                    color: '#ff6b35',
                    weight: 4,
                    opacity: 0.9,
                    dashArray: '6, 4'
                }
            }).addTo(map);
        }

        // ================================================================
        // 6. SELECCIÓN JERÁRQUICA
        // ================================================================
        function seleccionarItem() {
            const select = document.getElementById('selector-principal');
            const value = select.value;
            
            if (!value) {
                mostrarNivel('provincias');
                document.getElementById('info-content').innerHTML = `
                    <div class="sin-datos">
                        🗺️ Haz clic en una provincia en el mapa<br>
                        o selecciónala en el menú para ver los datos
                    </div>
                `;
                document.getElementById('sub-selectores').innerHTML = '';
                return;
            }

            const feature = JSON.parse(select.options[select.selectedIndex].dataset.feature);
            const tipo = select.options[select.selectedIndex].dataset.tipo || 'provincia';
            const props = feature.properties;
            
            if (tipo === 'provincia') {
                // Mostrar datos de la provincia
                mostrarDatosTabla(props, 'Provincia');
                resaltarFeature(feature);
                
                // Cargar distritos
                if (datos.distritos) {
                    cargarSubNivel('provincias', props);
                }
            }
        }

        function cargarSubNivel(nivel, props) {
            const container = document.getElementById('sub-selectores');
            
            if (nivel === 'provincias') {
                // Cargar distritos de la provincia seleccionada
                const provId = props.PROV_ID;
                const distritos = datos.distritos.features.filter(f => {
                    const p = f.properties;
                    return p.PROV_ID === provId || p.ID_PROV === provId || p.COD_PROV === provId;
                });

                if (distritos.length === 0) {
                    container.innerHTML = `<div style="font-size:9px;color:#888;padding:4px 0;">No hay distritos disponibles</div>`;
                    return;
                }

                let html = `<label style="margin-top:4px;">📍 Distrito:</label>
                    <select id="selector-distrito" onchange="seleccionarDistrito()">
                        <option value="">Seleccionar distrito...</option>`;
                
                distritos.sort((a, b) => {
                    const nomA = a.properties.DIST_NOMB || '';
                    const nomB = b.properties.DIST_NOMB || '';
                    return nomA.localeCompare(nomB);
                });
                
                distritos.forEach(f => {
                    const nombre = f.properties.DIST_NOMB || 'Sin nombre';
                    const id = f.properties.DIST_ID || '';
                    html += `<option value="${id}" data-feature='${JSON.stringify(f)}'>${nombre}</option>`;
                });
                
                html += `</select>`;
                container.innerHTML = html;

                // Mostrar distritos en el mapa
                mostrarNivel('distritos', provId);
                
            } else if (nivel === 'distritos') {
                // Cargar corregimientos del distrito seleccionado
                const distId = props.DIST_ID;
                const corregimientos = datos.corregimientos.features.filter(f => {
                    const p = f.properties;
                    return p.DIST_ID === distId || p.ID_DIST === distId || p.COD_DIST === distId;
                });

                if (corregimientos.length === 0) {
                    container.innerHTML = `<div style="font-size:9px;color:#888;padding:4px 0;">No hay corregimientos disponibles</div>`;
                    return;
                }

                let html = `<label style="margin-top:4px;">📍 Corregimiento:</label>
                    <select id="selector-corregimiento" onchange="seleccionarCorregimiento()">
                        <option value="">Seleccionar corregimiento...</option>`;
                
                corregimientos.sort((a, b) => {
                    const nomA = a.properties.CORR_NOMB || '';
                    const nomB = b.properties.CORR_NOMB || '';
                    return nomA.localeCompare(nomB);
                });
                
                corregimientos.forEach(f => {
                    const nombre = f.properties.CORR_NOMB || 'Sin nombre';
                    const id = f.properties.CORR_ID || '';
                    html += `<option value="${id}" data-feature='${JSON.stringify(f)}'>${nombre}</option>`;
                });
                
                html += `</select>`;
                container.innerHTML = html;

                // Mostrar corregimientos en el mapa
                mostrarNivel('corregimientos', distId);
            }
        }

        function seleccionarDistrito() {
            const select = document.getElementById('selector-distrito');
            if (!select) return;
            
            const value = select.value;
            if (!value) {
                // Volver a mostrar distritos
                const provSelect = document.getElementById('selector-principal');
                const provId = provSelect.value;
                if (provId) {
                    mostrarNivel('distritos', provId);
                }
                return;
            }

            const feature = JSON.parse(select.options[select.selectedIndex].dataset.feature);
            const props = feature.properties;
            
            mostrarDatosTabla(props, 'Distrito');
            resaltarFeature(feature);
            
            // Cargar corregimientos
            cargarSubNivel('distritos', props);
        }

        function seleccionarCorregimiento() {
            const select = document.getElementById('selector-corregimiento');
            if (!select) return;
            
            const value = select.value;
            if (!value) {
                // Volver a mostrar corregimientos
                const distSelect = document.getElementById('selector-distrito');
                if (distSelect) {
                    const distId = distSelect.value;
                    if (distId) {
                        mostrarNivel('corregimientos', distId);
                    }
                }
                return;
            }

            const feature = JSON.parse(select.options[select.selectedIndex].dataset.feature);
            const props = feature.properties;
            
            mostrarDatosTabla(props, 'Corregimiento');
            resaltarFeature(feature);
        }

        // ================================================================
        // 7. MOSTRAR DATOS EN TABLA
        // ================================================================
        function mostrarDatosTabla(props, titulo) {
            const container = document.getElementById('info-content');
            
            const nombre = props.PROV_NOMB || props.DIST_NOMB || props.CORR_NOMB || 'Sin nombre';
            
            const camposPrioritarios = [
                'PROV_ID', 'PROV_NOMB', 'DIST_ID', 'DIST_NOMB', 'CORR_ID', 'CORR_NOMB',
                'PROV_LEY', 'LEY_MOD_P', 'GACETA_P', 'GACE_MOD_P',
                'AREA', 'PERIMETRO',
                'N_PERSONAS', 'P_HOMBRES', 'P_MUJERES', 'MAYOR_18',
                'N_VIVIENDA', 'V_INDIV', 'V_APARTAM', 'V_IMPROV', 'V_CUARTOS', 'V_LOCAL',
                'TOTA_VIV_P', 'CON_PISO_T',
                'SIN_AGUA', 'SIN_SER_SA', 'SIN_LUZ', 'SIN_INTERN',
                'SIN_TV', 'SIN_RADIO', 'SIN_TEL_RE', 'SIN_TEL_CE',
                'COC_LEÑA', 'COC_CARBON',
                'MENOS_PRIM', 'AGROPEC', 'NO_ECO_ACT', 'DESOCUP', 'ANALFAB', 'CON_DISC',
                'V_COLECTIV', 'V_ASILOS', 'V_PRO_ADOL', 'V_CARCELES',
                'V_CON_REL', 'V_TRABA', 'V_ALBE_MIG', 'V_REHABILI', 'V_OTR_COLE',
                'V_DAMNI', 'V_INDIG',
                'ID1'
            ];

            let html = `<h4>📋 ${titulo}: ${nombre}</h4>`;
            html += `<table>`;

            let tieneDatos = false;

            camposPrioritarios.forEach(campo => {
                let valor = props[campo];
                if (valor !== undefined && valor !== null && valor !== '') {
                    tieneDatos = true;
                    const nombreCampo = descripcionCampos[campo] || campo;
                    
                    if (typeof valor === 'number' || !isNaN(parseFloat(valor))) {
                        const num = parseFloat(valor);
                        if (Number.isInteger(num)) {
                            valor = num.toLocaleString();
                        } else {
                            valor = num.toFixed(2);
                        }
                    }
                    html += `<tr>
                        <td class="campo">${nombreCampo}</td>
                        <td class="valor">${valor}</td>
                    </tr>`;
                }
            });

            html += `</table>`;

            if (!tieneDatos) {
                html = `<div class="sin-datos">No hay datos disponibles para esta área</div>`;
            }

            // Indicar nivel actual
            html += `<div class="nivel-indicador">📍 Nivel: ${titulo}</div>`;

            container.innerHTML = html;
        }

        // ================================================================
        // 8. EXPORTAR
        // ================================================================
        function exportarGeoJSON() {
            if (!capaActual) {
                alert('No hay ningún polígono seleccionado para exportar.');
                return;
            }

            const data = capaActual.toGeoJSON();
            const nombre = 'panama_' + nivelActual;

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${nombre}.geojson`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function exportarCSV() {
            // Buscar las propiedades del item seleccionado
            let props = null;
            const select = document.getElementById('selector-principal');
            if (select && select.value) {
                const feature = JSON.parse(select.options[select.selectedIndex].dataset.feature);
                props = feature.properties;
            }

            if (!props) {
                alert('No hay datos para exportar.');
                return;
            }

            const headers = Object.keys(props);
            const values = headers.map(h => props[h] !== undefined ? props[h] : '');
            
            let csv = headers.join(',') + '\n';
            csv += values.join(',') + '\n';

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `datos_${nivelActual}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // ================================================================
        // 9. MAPA BASE
        // ================================================================
        function cambiarMapa(tipo) {
            Object.keys(layers).forEach(key => {
                if (map.hasLayer(layers[key])) map.removeLayer(layers[key]);
            });
            if (layers[tipo]) layers[tipo].addTo(map);
            document.querySelectorAll('.btn-map').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${tipo}`).classList.add('active');
        }

        // ================================================================
        // 10. RESET
        // ================================================================
        function resetearMapa() {
            document.getElementById('selector-principal').selectedIndex = 0;
            document.getElementById('sub-selectores').innerHTML = '';
            
            if (capaActual) {
                map.removeLayer(capaActual);
                capaActual = null;
            }
            if (capaResaltado) {
                map.removeLayer(capaResaltado);
                capaResaltado = null;
            }

            mostrarNivel('provincias');
            
            document.getElementById('info-content').innerHTML = `
                <div class="sin-datos">
                    🗺️ Haz clic en una provincia en el mapa<br>
                    o selecciónala en el menú para ver los datos
                </div>
            `;
        }

        // ================================================================
        // 11. INICIO
        // ================================================================
        window.cambiarMapa = cambiarMapa;
        window.seleccionarItem = seleccionarItem;
        window.seleccionarDistrito = seleccionarDistrito;
        window.seleccionarCorregimiento = seleccionarCorregimiento;
        window.exportarGeoJSON = exportarGeoJSON;
        window.exportarCSV = exportarCSV;
        window.resetearMapa = resetearMapa;

        console.log('🗺️ Panamá - División Administrativa');
        console.log('📌 Cargando datos...');

        cargarTodosLosDatos();
    </script>

</body>
</html>
